# Publishes the board's Kanban view to GitHub Pages on every push to main.
#
# The point is to take a person out of the loop. A published copy of a
# generated file is a snapshot, and this project has measured how fast those
# go stale while still looking current: six hours, then ten minutes, then
# twenty, each one a regeneration somebody had to remember. Building it here
# means the published page is whatever `board/` said at the commit it was
# built from, and nobody has to remember anything.
#
# It is generated FRESH from the cards, and since 2026-09-15 there is nothing
# else it could serve: the generated views are gitignored rather than committed,
# because every branch touching any card conflicted with every other on two
# derived files. So this workflow is now the ONLY published copy of the board,
# which raises what it is worth rather than lowering it — a build from source
# can state the commit it came from in its own stamp, and a copied file cannot.
#
# The consequence to keep in view: if this workflow breaks, the board becomes
# unreadable to anyone outside the repo, where before they could fall back on
# the committed markdown. The cards are still all there and still the source of
# truth — `board/`, one file each — so nothing is lost, but the convenient view
# is gone until this is fixed.
name: Board on Pages

on:
  push:
    branches: [main]
    # Only what can change the page. A docs typo should not redeploy a site.
    paths:
      - 'board/**'
      - 'scripts/build-board.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, newest wins. Two merges a minute apart should leave
# the later one published, not whichever job happened to finish last.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build the board from board/ and publish it
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   # same toolchain the repo develops on

      # No `npm ci`: the generator is plain Node with no dependencies, so the
      # install would be a minute spent on nothing.
      - name: Build the board page
        run: |
          mkdir -p _site
          node scripts/build-board.js \
            --html _site/index.html \
            --auto \
            --stamp "main @ $(git rev-parse --short HEAD), $(date -u '+%-d %b %Y, %H:%M UTC')"

      # A page that says 51 cards when board/ holds none would be a deploy of
      # an empty board, and the stamp would make it look authoritative. Cheap
      # to assert, and the failure it guards is silent.
      - name: The page is not empty
        run: |
          test -s _site/index.html
          grep -q 'The Obsrv board' _site/index.html
          cards=$(ls board/*.md | wc -l)
          test "$cards" -gt 0
          echo "built from $cards cards"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
