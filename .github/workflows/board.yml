# The board's views are generated from board/ and are NOT committed — they are
# gitignored as of 2026-09-15, built locally by `npm run board`, and published
# from main by pages.yml. So this no longer compares anything.
#
# WHAT IT CHECKS NOW: that every card can be read and rendered. A missing
# frontmatter block, a broken field, a column nothing knows — the failure names
# the card. Small, and the whole of what is left to promise: a stored copy
# cannot go stale when there is no stored copy.
#
# It is worth catching HERE rather than in the Pages deploy, where the same
# broken card would surface as a failed publish of the page people read, after
# the push rather than instead of it.
#
# IT RUNS ON PUSH TO EVERY BRANCH, AND THAT IS THE WHOLE POINT. It used to be a
# step inside ci.yml, which runs on `pull_request` — and a pull_request workflow
# runs against `refs/pull/N/merge`, which GitHub cannot compute while the PR
# conflicts. So the check was absent on exactly the pull requests that needed
# it. Kenya found this on PR #1, the first pull request this repository ever
# had: `event=pull_request` total_count was 0 against 267 pushes.
#
# The conflict problem that reasoning was written about is now gone at the root:
# nothing conflicts on a derived file that nobody commits. The trigger stays on
# every branch anyway, because a card that cannot render should be refused
# wherever it is pushed.
#
# A branch push always happens and has no merge ref to compute, so this cannot
# expire the way a PR's checks silently did.
#
# Known gap, stated rather than left to be discovered: a pull request from a
# FORK pushes to the fork, not here, so this does not run for one. This repo has
# had no fork PRs; when it does, ci.yml's pull_request trigger is what covers
# them, and only when they are mergeable.
name: Board

on:
  push:
  workflow_dispatch:

# Newest wins per ref on a branch; on main every commit gets its own group, so
# nothing there can be superseded. See ci.yml for why the obvious form of this
# silently cancelled three main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: The board matches the cards it is generated from
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No `npm ci`: the generator is plain Node with no dependencies, so an
      # install would be a minute spent on nothing. That is also why this is
      # its own workflow rather than a step in the macOS suite — it is seconds
      # on ubuntu, and it should answer on a branch whether or not the full
      # suite is worth running there.
      - name: npm run board:check
        run: npm run board:check
