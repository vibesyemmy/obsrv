# Obsrv CI — the full verification the repo runs locally, on every push/PR,
# plus unsigned DMG artefacts on version tags.
#
# Everything runs on macOS: the e2e suite drives the real Electron app
# (offscreen 1x rendering is the product), and macOS runners provide the
# display session Electron needs.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: typecheck · unit · shader parity · e2e
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc   # same toolchain the repo develops on
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (Vitest browser mode)
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Shader parity (browser)
        run: npm run test:browser

      - name: Build
        run: npm run build

      # --retries=1 absorbs the known-flaky mobile input-forwarding test on
      # loaded runners; a persistent failure still fails the job.
      - name: E2E (Playwright driving the Electron app)
        run: npx playwright test --retries=1

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  dmg:
    name: Unsigned DMG artefacts
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc   # same toolchain the repo develops on
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMGs (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: obsrv-dmgs
          path: |
            dist/*.dmg
            dist/*.blockmap
          retention-days: 30
