# PROBE, never for main: a release candidate, verified cold before anyone publishes it.
name: CI

on:
  workflow_dispatch:
    inputs:
      sha:
        description: commit to verify
        required: true

jobs:
  pack:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: release:pack
        run: |
          git log --oneline -1
          npm ci > /dev/null
          npm run release:pack 2>&1 | tail -15
          mkdir -p rc && mv getobsrv-*.tgz rc/ && ls -la rc && git log --oneline -1 > rc/commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: rc-tarball
          path: rc

  dist:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: unsigned DMG, as the tag workflow builds it
        run: |
          npm ci > /dev/null
          npm run dist 2>&1 | tail -8
          ls -la dist/*.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: rc-dmg
          path: dist/*arm64.dmg

  cli-cold:
    needs: pack
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: a3probe
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: rc-tarball
          path: rc
      - name: serve a page
        run: |
          nohup python3 -m http.server 8765 --directory a3probe > server.log 2>&1 &
          sleep 2
      - name: install, version, help, skill
        run: |
          cat rc/commit.txt
          { time npm i -g ./rc/getobsrv-*.tgz; } 2>&1 | tail -4
          obsrv --version; echo "exit $?"
          obsrv --help | head -12
          obsrv install-skill; echo "exit $?"
      - name: first snap, audit
        run: |
          { time obsrv snap http://127.0.0.1:8765/page.html --preset laptop-768 --out first.png; echo "exit $?"; } 2>&1 | grep -v "XPC error" | tail -20
          { time obsrv audit https://example.com --preset android-65 > audit.json; echo "exit $?"; } 2>&1 | grep -v "XPC error" | tail -6
          head -c 600 audit.json

  mcp-cold:
    needs: pack
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: a3probe
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: rc-tarball
          path: rc
      - name: serve a page, client
        run: |
          nohup python3 -m http.server 8765 --directory a3probe > server.log 2>&1 &
          sleep 2
          mkdir -p "$RUNNER_TEMP/client" && cp a3probe/mcp-client.mjs rc/getobsrv-*.tgz "$RUNNER_TEMP/client/"
          cd "$RUNNER_TEMP/client" && npm init -y > /dev/null && npm i @modelcontextprotocol/sdk@1 > /dev/null 2>&1
      - name: first MCP session, no app installed
        run: |
          cd "$RUNNER_TEMP/client"
          ls /Applications | grep -i obsrv || echo "no Obsrv.app installed"
          node mcp-client.mjs http://127.0.0.1:8765/page.html "./$(ls getobsrv-*.tgz)" 2>&1 | grep -v "npm notice" | cut -c1-700
      - name: where the launched app wrote
        run: |
          find ~/Library/Application\ Support -maxdepth 2 -name control.json -print
          for d in "$HOME/Library/Application Support/Obsrv" "$HOME/Library/Logs/Obsrv" "$HOME/Library/Application Support/Electron" "$HOME/Library/Logs/Electron"; do if [ -e "$d" ]; then echo "present: $d"; else echo "absent:  $d"; fi; done

  app-cold:
    needs: dist
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: a3probe
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: rc-dmg
          path: dl
      - name: mount, copy, launch, read
        run: |
          hdiutil attach dl/*.dmg -nobrowse -mountpoint "$RUNNER_TEMP/mnt" | tail -1
          mkdir -p "$RUNNER_TEMP/Applications" && cp -R "$RUNNER_TEMP/mnt/Obsrv.app" "$RUNNER_TEMP/Applications/"
          mkdir -p "$RUNNER_TEMP/pw" && cp a3probe/app-launch.mjs "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw" && npm init -y > /dev/null && npm i playwright@1.62 > /dev/null 2>&1
          node app-launch.mjs "$RUNNER_TEMP/Applications/Obsrv.app/Contents/MacOS/Obsrv" 2>&1 | tail -30
          cp rc-app-first-window.png "$GITHUB_WORKSPACE/" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc-app-window
          path: rc-app-first-window.png
