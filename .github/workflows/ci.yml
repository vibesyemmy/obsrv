# Obsrv CI — the full verification the repo runs locally, on every push/PR,
# plus unsigned DMG artefacts on version tags. A tag also checks that the
# generated `plugin` branch was rebuilt for it, and the release waits on that.
#
# A version tag does NOT re-run the suite. It points at a commit that was
# pushed to `main` and tested there minutes earlier, so running it again cost
# ~14 minutes of macOS CI for an answer already held — and, twice in a row
# (0.54.0's update.spec, 0.55.0's text-scale.spec), a flake in that redundant
# run skipped the DMG publish and left npm live with no downloads on the
# release page. The invariant is kept by proving it instead: `tested-on-main`
# below requires the tagged commit to be on `main` and to have a successful
# CI run of its own.
#
# Everything runs on macOS: the e2e suite drives the real Electron app
# (offscreen 1x rendering is the product), and macOS runners provide the
# display session Electron needs.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: typecheck · unit · shader parity · e2e
    # Not on a version tag: `tested-on-main` proves this tree already passed
    # here, on the `main` push the tag was cut from.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   # same toolchain the repo develops on
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (Vitest browser mode)
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Shader parity (browser)
        run: npm run test:browser

      - name: Build
        run: npm run build

      # --retries=1 absorbs the known-flaky mobile input-forwarding test on
      # loaded runners; a persistent failure still fails the job.
      - name: E2E (Playwright driving the Electron app)
        run: npx playwright test --retries=1

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Tags only: `main` between releases is legitimately ahead of the plugin
  # branch, so this would fail on every ordinary push. On a `v*` tag the two
  # must agree, because the marketplace entry that ships in that release pins
  # `plugin-v<version>` — a cut that skipped `npm run plugin:branch` points
  # every `claude plugin install` at a ref that cannot be cloned. Cheap enough
  # (no npm ci, the script is node builtins and git) to gate the release on.
  plugin-tag:
    name: The plugin tag matches the tree it claims to build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the check compares against plugin-v<version>, so tags must be here

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Compare plugin-v<version> against scripts/build-plugin-branch.js
        run: node scripts/build-plugin-branch.js --check

  # Tags only, and the reason the suite above can sit this one out: the DMGs
  # ship from a tree the suite passed, and this says so out loud rather than
  # assuming it. Two facts, both cheap — the tagged commit is on `main`, and
  # `main`'s own CI went green for that exact SHA. A tag cut from a side
  # branch, or pushed before `main` finished, fails here with which of the two
  # was missing, instead of publishing untested DMGs.
  tested-on-main:
    name: The tagged commit is one main tested
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_SHA is not on main. A release is cut from main, so the DMGs would ship a tree nobody reviewed there."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      - name: Main's CI passed for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag's own run is excluded by name: it shares this SHA and is
          # in flight right now, so only a run of `main` counts as the answer.
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" \
            --json conclusion,headBranch \
            --jq '[.[] | select(.headBranch == "main" and .conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::No successful CI run of main for $GITHUB_SHA. Wait for main to go green, then re-run this job."
            exit 1
          fi
          echo "main's CI passed for $GITHUB_SHA"

  release:
    name: Publish DMGs to a GitHub Release
    needs: [tested-on-main, plugin-tag]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   # same toolchain the repo develops on
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMGs (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      # The app's update check reads this release's tag, so the tag is the
      # version users are offered. Blockmaps are useless to the check-only
      # client and are attached because electron-updater wants them if
      # signing ever lands.
      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true
