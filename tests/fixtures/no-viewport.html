<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>no-viewport-fixture</title>
    <style>
      html, body { margin: 0; background: #fff; }
      /* Wider than any phone CSS viewport, narrower than the 980px virtual
         one: without a viewport meta a phone lays the page out at 980 and
         shows it zoomed out, so this bar fits without horizontal scroll. */
      .bar { width: 900px; height: 40px; background: #00ff00; }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <p>no viewport meta</p>
  </body>
</html>
