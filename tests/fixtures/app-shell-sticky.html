<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App shell with a sticky toolbar inside its scroller</title>
    <!--
      The app-shell pattern (see app-shell-findings.html) with chrome stuck
      *inside* the scroller. Bands after the first are sliced down to the
      scroller's own rows, so the app header and the left nav need no help —
      they are already out of those bands. The toolbar is not: it stays at the
      top of the scroller at every scroll position and is painted into every
      slice, hiding the rows behind it.

      Three shapes the detection has to tell apart:
        · #toolbar   — sticky, spans the scroller, 44 px: hidden from band 2 on
        · #rail      — sticky and stuck, but a column: left alone
        · #app       — fixed, full-bleed, never moves, and *holds* the scroller:
                       must never be hidden, or the capture is blank
        · #app-header / #app-nav — outside the scroller, sliced out already

      A bar spanning the scroller is 1,166 of 1,366 CSS px at laptop-768, so it
      is not full-bleed against the viewport: the frame has to be the scroller.
    -->
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; font: 16px/1.5 system-ui, sans-serif; }
      #app { position: fixed; inset: 0; display: flex; flex-direction: column; background: #fff; }
      #app-header { flex: 0 0 56px; background: #101828; color: #fff; padding: 16px; }
      #app-body { flex: 1 1 auto; min-height: 0; display: flex; }
      #app-nav { flex: 0 0 200px; background: #f3f4f6; padding: 8px; }
      #scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
      #toolbar { position: sticky; top: 0; height: 44px; background: #2563eb; color: #fff; padding: 8px 16px; z-index: 5; }
      #rail { position: sticky; top: 44px; float: right; width: 15%; height: 300px; background: #e5e7eb; padding: 8px; }
      .row { height: 600px; padding: 8px 16px; }
      .row:nth-child(odd) { background: #f9fafb; }
      .row:nth-child(even) { background: #eef2ff; }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="app-header">App header, outside the scroller</header>
      <div id="app-body">
        <nav id="app-nav">Nav</nav>
        <main id="scroller">
          <div id="toolbar">Sticky toolbar</div>
          <div id="rail">Sticky rail</div>
          <div class="row">Row 1</div>
          <div class="row">Row 2</div>
          <div class="row">Row 3</div>
          <div class="row">Row 4</div>
          <div class="row">Row 5</div>
        </main>
      </div>
    </div>
  </body>
</html>
