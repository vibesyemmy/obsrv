<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>locked-fixture</title>
    <style>
      html, body { margin: 0; background: #fff; font-family: Arial, sans-serif; color: #111; }
      /* The consent-layer trick theguardian.com uses: the body fixed in place, so
         the document's own scroll range collapses to the viewport while the page
         underneath keeps its full height and its controls their positions. */
      body { position: fixed; inset: 0; overflow: hidden; }
      #layer { position: fixed; inset: 0; background: rgba(0, 32, 96, 0.92); color: #fff; padding: 48px; font-size: 18px; }
      #layer button { font-size: 16px; padding: 12px 24px; margin-top: 24px; }
      #page { padding: 16px; }
      #spacer { height: 3600px; background: linear-gradient(#fff, #f3f3f3); }
      .deep { display: block; width: 24px; height: 24px; padding: 0; font-size: 10px; }
    </style>
  </head>
  <body>
    <div id="page">
      <p>The page behind the layer, four screenfuls of it, with controls near the bottom.</p>
      <div id="spacer"></div>
      <button class="deep" id="deep-1" type="button" aria-label="Deep one">1</button>
      <button class="deep" id="deep-2" type="button" aria-label="Deep two">2</button>
    </div>
    <div id="layer">
      <p>It's your choice: a consent layer that holds the page in place.</p>
      <button id="accept" type="button">Yes, I accept</button>
    </div>
  </body>
</html>
