<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App shell — nothing the walk can scroll</title>
    <!--
      The shape play.tailwindcss.com actually has (measured 2026-09-06): the
      root and body are `overflow: hidden`, and there is no light-DOM element
      with `overflow-y: auto|scroll` that overflows — the content lives in an
      iframe and in a virtualised editor that scrolls by transform. So the
      scroll-host walk finds nothing, correctly, and the capture is one
      screen. It should say that rather than look complete.
    -->
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; font: 16px/1.5 system-ui, sans-serif; }
      .chrome { height: 48px; background: #101828; color: #fff; display: flex; align-items: center; padding: 0 16px; }
      /* Clipped, not scrollable: nothing here qualifies as a scroll host. */
      .clipped { height: calc(100% - 48px); overflow: hidden; }
      iframe { width: 100%; height: 2000px; border: 0; }
    </style>
  </head>
  <body>
    <header class="chrome">Fixed chrome</header>
    <div class="clipped">
      <iframe title="preview" srcdoc="&lt;body style='margin:0;font:16px system-ui'&gt;&lt;div style='height:2000px;background:linear-gradient(#fff,#eee)'&gt;Content inside an iframe&lt;/div&gt;&lt;/body&gt;"></iframe>
    </div>
  </body>
</html>
