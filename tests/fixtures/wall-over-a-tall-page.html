<!doctype html>
<meta charset="utf-8">
<title>Behind a wall</title>
<!--
  ft.com's shape, reduced (run 15, 2026-09-12): a fixed body that hides its
  overflow, one iframe over the whole viewport, and a tall page beneath that
  the walk never reaches. Distinct from iframe-wall.html, which is the etsy
  shape — a document that is *only* the wall, and measures as empty. Here the
  page beneath measures fine, so the sentence under test is the walk's, not
  the empty document's.
-->
<style>
  html { overflow: hidden }
  body { margin: 0; position: fixed; inset: 0; overflow: hidden; font: 16px system-ui }
  .page { height: 8000px; padding: 24px }
  .page button { display: block; margin: 8px 0; padding: 8px 12px }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff }
</style>
<div class="page">
  <h1>The page beneath</h1>
  <p>Eight screenfuls nobody reached.</p>
  <button>one</button><button>two</button><button>three</button>
</div>
<iframe title="consent" srcdoc="<p style='font:16px system-ui;padding:24px'>Cookies on this site</p>"></iframe>
