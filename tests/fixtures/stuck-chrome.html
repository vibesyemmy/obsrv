<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A page with chrome stuck to the viewport</title>
    <!--
      One of each shape measured on real pages at 1366×768:
        · a `fixed` full-width header (tailwindcss.com/docs)
        · a `sticky` full-width bar that starts below its stick point and only
          stops once the page has scrolled under it (developer.mozilla.org)
        · a `sticky` side rail, which is stuck too but covers no page content
          (both of them) — hiding it would leave a blank column, so it stays
        · a bar that scrolls away, which nothing should touch

      The page is deliberately several bands tall at laptop-768. Each 800 px
      row paints a colour of its own, so a band that lost rows behind the
      chrome shows it.
    -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
      #fixed-bar { position: fixed; inset: 0 0 auto 0; height: 56px; background: #101828; color: #fff; padding: 16px; z-index: 10; }
      #lede { height: 300px; padding-top: 72px; }
      #sticky-bar { position: sticky; top: 56px; height: 40px; background: #2563eb; color: #fff; padding: 8px 16px; z-index: 9; }
      #rail { position: sticky; top: 100px; float: left; width: 18%; height: 400px; background: #e5e7eb; padding: 8px; }
      #scrolls-away { height: 40px; background: #fde68a; padding: 8px 16px; }
      .row { height: 800px; padding: 8px 16px; }
      .row:nth-child(odd) { background: #f9fafb; }
      .row:nth-child(even) { background: #eef2ff; }
    </style>
  </head>
  <body>
    <header id="fixed-bar">Fixed header</header>
    <div id="lede">Lede, above the sticky bar's stick point.</div>
    <div id="sticky-bar">Sticky bar</div>
    <aside id="rail">Sticky rail</aside>
    <div id="scrolls-away">This bar scrolls away</div>
    <main>
      <div class="row">Row 1</div>
      <div class="row">Row 2</div>
      <div class="row">Row 3</div>
      <div class="row">Row 4</div>
    </main>
  </body>
</html>
