<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ready</title>
    <style>
      html, body { margin: 0; background: #fff; }
      /* The whole viewport is the button, so any forwarded click hits it. */
      button { display: block; width: 100vw; height: 100vh; font-size: 48px; }
    </style>
  </head>
  <body>
    <button onclick="document.title = 'clicked'">click me</button>
  </body>
</html>
