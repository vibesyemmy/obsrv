<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App shell — a feed past every band the capture will take</title>
    <!--
      For `cli/main.ts`'s app-shell band cap: "the page scrolls an inner
      container <n> CSS px tall; captured the first <n> bands of <n> CSS px
      (12 at most) — what lies past them is not in the raster".

      WHY A NEW FIXTURE, measured rather than assumed. A probe
      (`probe/c5-caps`, run 35324187068) ran `--full-page --tiled` over the four
      app shells that already existed — `app-shell`, `app-shell-grows`,
      `app-shell-findings`, `shell-with-one-root` — and **none of them said
      anything**. Their feeds are a few screens tall, and the cap is twelve
      bands of the scroller's own height: about 8,640 CSS px at `laptop-768`,
      where the feed is the viewport less this chrome bar. So the sentence had
      no fixture, and the four that looked like they should produce it do not.

      This one is the same shape as `app-shell.html` — a clipped document whose
      only scroller is an inner feed — with the one difference that matters:
      the feed's content is 20,000 px, comfortably past twelve bands, so the
      capture stops short and has to say so.

      The rows are plain and cheap on purpose. This fixture is about height, and
      a page that also produced audit findings would make a test that asserts
      one sentence fail for a reason it is not about.
    -->
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; font: 16px/1.5 system-ui, sans-serif; background: #fff; }
      .chrome { height: 48px; background: #101828; color: #fff; display: flex; align-items: center; padding: 0 16px; }
      /* The only scroller on the page, and the thing the band loop measures. */
      .feed { height: calc(100% - 48px); overflow-y: auto; }
      .rows { height: 20000px; background: linear-gradient(#fff, #eef2f7); padding: 16px; }
      .row { height: 56px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; }
    </style>
  </head>
  <body>
    <div class="chrome">A shell whose feed outruns the bands</div>
    <div class="feed">
      <div class="rows">
        <div class="row">First row, in the first band.</div>
        <div class="row">Second row.</div>
        <div class="row">Third row. Everything past the twelfth band is not in the raster, and the capture says so.</div>
      </div>
    </div>
  </body>
</html>
