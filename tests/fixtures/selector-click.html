<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>selector-click-fixture</title>
    <style>
      html, body { margin: 0; background: #fff; font: 16px system-ui, sans-serif; }
      /* A fixed header, because it is the thing that makes the scroll placement
         load-bearing: an element scrolled flush to y = 0 lands UNDER this, and
         the click reaches the header instead of the element. It logs its own
         hits, so that failure is visible rather than silent. */
      #bar { position: fixed; top: 0; left: 0; right: 0; height: 120px; background: #123; color: #fff; }
      .spacer { height: 2000px; background: linear-gradient(#fff, #ccc); }
      button { display: block; width: 240px; height: 56px; font-size: 18px; }
      #top-cta { margin: 160px 0 0 20px; }
      #below-cta { margin: 0 0 0 20px; }
      #hidden-cta { display: none; }
      #flat { height: 0; overflow: hidden; }
      /* A wrapped inline link, the shape `bug-selector-click-presses-the-gap` is
         about: narrow enough that the text runs to two lines, with line-height
         leaving a gap between them. The link's border box spans both lines AND
         that gap, and the gap paints as the <p> around it. */
      #wrap-host { width: 150px; margin: 24px 0 0 20px; line-height: 2.2; font-size: 14px; }
      /* The same shape at three lines or more (`feat-inspect-line-rects`): narrow enough that the link
         wraps past two, which is the case five fixed fractions inside the union could not promise to reach. */
      #wrap-host-3 { width: 90px; margin: 24px 0 0 20px; line-height: 2.2; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="bar" onclick="log('bar')">a fixed header, 120px tall</div>
    <button id="top-cta" onclick="log('top')">top</button>
    <div class="spacer"></div>
    <button id="below-cta" onclick="log('below')">below the fold</button>
    <button id="hidden-cta" onclick="log('hidden')">display: none</button>
    <div id="flat" onclick="log('flat')">zero height</div>
    <p id="wrap-host" onclick="log('host')">
      <a id="wrapped-link" href="#" onclick="log('wrapped'); return false;">A product title long enough to wrap</a>
    </p>
    <p id="wrap-host-3" onclick="log('host3')">
      <a id="wrapped-link-3" href="#" onclick="log('wrapped3'); return false;">A product title long enough to wrap onto three lines or more</a>
    </p>
    <div class="spacer"></div>
    <script>
      // The click log lives in the title so a test can read it with one
      // `executeJavaScript`, the same way `button.html` does.
      window.clicks = []
      function log(what) {
        window.clicks.push(what)
        document.title = 'clicked: ' + window.clicks.join(',')
      }
    </script>
  </body>
</html>
