    <style>
      html, body { margin: 0; background: #fff; font-family: Arial, sans-serif; color: #111; }
      body { padding: 16px; }
      /* Edges. A 0.5px border is half a device pixel on a 1x screen and a
         whole one at 2x; the 1px border is never in question. */
      #hair { border-top: 0.5px solid #999; height: 20px; }
      #solid { border-top: 1px solid #999; height: 20px; }
      #rule { height: 0.5px; background: #999; margin: 8px 0; }
      #shadow { box-shadow: 0 0 0 0.5px #999; height: 20px; margin: 8px 0; }
      #soft { box-shadow: 0 2px 8px rgba(0,0,0,.2); height: 20px; margin: 8px 0; }
      /* Weight. 300 at 12px is 12 device px on a 1x screen, 24 on a phone. */
      #thin { font-weight: 300; font-size: 12px; }
      #regular { font-weight: 400; font-size: 12px; }
      /* Colour. #767676 on white is 4.54:1, just over AA; #999 is 2.85:1. */
      #grey { color: #767676; font-size: 16px; }
      #fail { color: #999; font-size: 16px; }
      #big { color: #767676; font-size: 32px; font-weight: 400; margin: 8px 0; }
      #onimage { background: linear-gradient(#eee, #ddd); color: #999; padding: 4px; }
      img { display: block; margin: 8px 0; }
    </style>
