<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>hairline-fixture</title>
    <style>
      html, body { margin: 0; background: #fff; color: #000; }
      body { font: 12px/1.5 -apple-system, system-ui, sans-serif; padding: 16px; }
      .hairline { height: 0; border-top: 0.5px solid #000; margin: 24px 0; }
      .thin { font-weight: 300; font-size: 12px; color: #767676; }
      .ramp { height: 48px; background: linear-gradient(90deg, #000, #fff); }
    </style>
  </head>
  <body>
    <div class="hairline"></div>
    <p class="thin">Thin 300-weight 12px text at low contrast</p>
    <div class="hairline"></div>
    <div class="ramp"></div>
  </body>
</html>
