<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>audit-fixture</title>
    <style>
      html, body { margin: 0; background: #fff; font-family: Arial, sans-serif; color: #111; }
      body { padding: 16px; }
      /* A generous control and a mean one. 24 CSS px is 6.6 mm on a 24" 1080p
         and 4.5 mm on a 6.5" phone: under 7 mm on both. 48 px clears 7 mm on
         both (13 mm and 9 mm). */
      #big { display: block; width: 200px; height: 48px; font-size: 16px; margin: 0 0 12px; }
      #tiny { display: block; width: 24px; height: 24px; padding: 0; font-size: 10px; margin: 0 0 12px; }
      #link { font-size: 16px; }
      /* Body text and a caption. 10px is 2.8 mm on the 1080p (fine) and
         1.9 mm on the phone (under 2 mm). 16px clears 2 mm on both. */
      #body { font-size: 16px; margin: 12px 0 0; }
      #caption { font-size: 10px; margin: 4px 0 0; color: #555; }
      /* Not rendered, and so not counted. */
      #hidden { visibility: hidden; font-size: 4px; }
      #none { display: none; font-size: 4px; }
      #zero { font-size: 0; }
      #zero span { font-size: 16px; }
      #ghost { opacity: 0; width: 10px; height: 10px; }
    </style>
  </head>
  <body>
    <button id="big" type="button">A generous button</button>
    <button id="tiny" type="button" aria-label="Close">×</button>
    <a id="link" href="#top">A text link</a>
    <p id="body">Body text at sixteen pixels, which is comfortable on any of the presets in the list.</p>
    <p id="caption">A caption at ten pixels, fine on a monitor, too small on a phone.</p>
    <p id="hidden">Hidden by visibility</p>
    <p id="none">Hidden by display</p>
    <p id="zero"><span id="zero-child">Text in a zero-size wrapper</span></p>
    <button id="ghost" type="button">Ghost</button>
  </body>
</html>
