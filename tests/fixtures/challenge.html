<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just a moment…</title>
<!--
  An interstitial the way a challenge page behaves: nothing to measure in it,
  and 400 ms after it loads it navigates to the real page (audit.html).
-->
<style>body{margin:0;background:#fff}#spin{width:40px;height:40px;margin:200px auto;border:4px solid #ddd;border-top-color:#333;border-radius:50%}</style>
<div id="spin"></div>
<script>addEventListener('load', () => setTimeout(() => { location.href = 'audit.html' }, 400))</script>
