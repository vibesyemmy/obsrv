<!doctype html>
<meta charset="utf-8">
<title>Reloads during the walk</title>
<!--
  Tall, so the live walk takes seconds, and it reloads to the *same* address
  while that walk is running. This is the shape a string comparison cannot
  see: the document the figures come from has been replaced, and the address
  is identical either side of it.

  Timing matters and is the point. A short page is measured almost as soon as
  it loads, so a page that moves afterwards moved after the figures were
  taken and silence is correct. Only a move *inside* the measurement window
  makes the figures be of a page other than the one that was walked.
-->
<style>body{font:16px system-ui;margin:0}.s{height:900px;padding:24px;border-bottom:1px solid #ccc}</style>
<div class="s"><h1>Reloads during the walk</h1><button style="width:220px;height:44px">One</button></div>
<div class="s"><button style="width:220px;height:44px">Two</button></div>
<div class="s"><button style="width:220px;height:44px">Three</button></div>
<div class="s"><button style="width:220px;height:44px">Four</button></div>
<div class="s"><button style="width:220px;height:44px">Five</button></div>
<div class="s"><button style="width:220px;height:44px">Six</button></div>
<script>
  // Triggered by the walk, not by a clock. A timer races the walk's duration
  // — the first version fired at 700 ms and was flaky on a warm app that had
  // already finished walking — so the reload hangs off the first scroll the
  // walk performs. The commit then lands inside the measurement window every
  // time, which is the condition under test rather than a hope about speed.
  if (!sessionStorage.getItem('obsrv-walk-reload')) {
    addEventListener(
      'scroll',
      () => {
        sessionStorage.setItem('obsrv-walk-reload', '1')
        location.reload()
      },
      { once: true },
    )
  }
</script>
