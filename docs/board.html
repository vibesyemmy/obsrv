<script>
const DATA = JSON.parse("{\"columns\":[{\"id\":\"backlog\",\"name\":\"Backlog\",\"blurb\":\"Raised, not yet picked.\",\"cards\":[{\"id\":\"c5\",\"title\":\"Note inventory: every note seen to fire on a real page\",\"owner\":\"\",\"criterion\":\"C5\",\"kind\":\"readiness\",\"evidence\":\"The 2026-09-13 sweep did this for notes and found gaps; never completed.\"},{\"id\":\"c2\",\"title\":\"Name breaking changes as such, by rule not habit\",\"owner\":\"\",\"criterion\":\"C2\",\"kind\":\"readiness\",\"evidence\":\"Partly met by habit. url changed meaning for live callers in 0.59.0.\"},{\"id\":\"a2\",\"title\":\"Auto-update: reach the new version without leaving the app\",\"owner\":\"\",\"criterion\":\"A2\",\"kind\":\"readiness\",\"evidence\":\"The updater checks GitHub daily and offers the release page; it never installs. Someone on 0.57.0 has no way to know.\"},{\"id\":\"a3\",\"title\":\"Cold-machine first run, on each surface\",\"owner\":\"\",\"criterion\":\"A3\",\"kind\":\"readiness\",\"evidence\":\"Never done on a machine that has never run Obsrv. Read the output as a stranger would.\"},{\"id\":\"b2\",\"title\":\"Close or write down the remaining known gaps\",\"owner\":\"\",\"criterion\":\"B2\",\"kind\":\"readiness\",\"evidence\":\"Settle gap closed 2026-09-14. Still open: the dialog note has never fired on a live site across four runs; whether to enter open shadow roots is undecided.\"},{\"id\":\"bug-arrivals\",\"title\":\"A mirrored redirect's second commit can still be counted as an arrival\",\"owner\":\"\",\"criterion\":\"B2\",\"kind\":\"bug\",\"evidence\":\"Deferred 2026-09-14 in commit 7d811f8. Two causes race for that commit; when it lands unmarked the arrivals counter counts it, so the spurious 'navigated after it loaded' note can fire on a redirect.\"},{\"id\":\"bug-orientation-name\",\"title\":\"`orientation: landscape` produces a portrait screen on every desktop preset\",\"owner\":\"\",\"criterion\":\"C2\",\"kind\":\"bug\",\"evidence\":\"src/shared/calibration.ts:40 — the flag names which STORED form to use (as-listed, or rotated a quarter turn), not the shape you get. 1080p-24 is stored 1920x1080, so the default gives landscape and `orientation: 'landscape'` rotates it to 1080x1920. `screenShape` then correctly reports 'portrait' beside it; both fields are right and answer different questions (comment at calibration.ts:37). cli/args.ts:190-200 documents all of it. Not a behaviour bug — a name that inverts its plain meaning. Evidence it costs: obsrv-e7 hit it on 2026-09-14 while hunting C4 parity defects, measured two different viewports without noticing, and was about to file it as a parity defect. Renaming is a breaking change to a public flag and an MCP field, so it is C2's to schedule, not a quiet fix.\"},{\"id\":\"bug-dev-app-exited\",\"title\":\"A dev app exited between 18:42 and 19:13 with no explicit stop\",\"owner\":\"\",\"criterion\":\"\",\"kind\":\"bug\",\"evidence\":\"Observed by Kenya 2026-09-14. **Titled for what was seen rather than for a mechanism, at Kenya's insistence — it declined to let this be filed as \\\"the lane reaps idle apps\\\" because the code says otherwise and that would have been a second claim inferred from mechanism within the hour.** Nobody knows why this app exited. That is the card.\\n\\nTIMELINE, local time:\\n\\n- ~17:55 — Kenya deliberately killed pid 65770\\n- then     relaunched with `--no-build`, got pid 2299\\n- 18:42:47 — the shared log's last write (`window hidden; target rasterisation paused` / `window shown; … resumed`, repeatedly)\\n- 19:13 — pid 2299 gone, noticed incidentally while checking something else\\n\\nSo it died inside that half hour, after logging normally.\\n\\nWHY THIS IS SURPRISING RATHER THAN EXPECTED, verified in the source rather than taken from the report:\\n\\n- `scripts/lane.js:59` spawns the app `detached: true, stdio: 'ignore'` and calls `.unref()`. It is in its own process group and should outlive the shell that launched it.\\n- Nothing in `scripts/lane.js`, `scripts/devLane.js` or `src/main/controlServer.ts` reaps an idle app. The only kills are the explicit stop path — `devLane.js:157` SIGTERM, `devLane.js:167` SIGKILL after a grace. The `process.kill(pid, 0)` at `devLane.js:133` is a liveness probe, not a kill.\\n\\nA LEAD, TO BE HELD LOOSELY: the last lines are occlusion transitions — the same macOS desk state the visibility and log specs skip over. That is a place to look, not a cause, and Kenya flagged it as exactly the kind of lead someone will harden into an explanation if it is written down carelessly.\\n\\nWHAT CANNOT BE SAID: whether it crashed, was killed from outside the lane, or exited cleanly. The lane app writes to the shared `~/Library/Logs/Obsrv/obsrv.log` with no field naming its writer, so its own exit line — if it wrote one — is indistinguishable from the installed app's.\\n\\n**Which makes this card blocked on [[bug-log-attribution]] in practice.** Investigating it means reading a log that cannot say which process produced a line. Stamping the line should land first, or whoever takes this spends the effort and comes back with the same two-facts absence.\\n\\nCOST TO REPRODUCE: a relaunch and an idle half hour, spent watching a process rather than driving anything. Kenya will take it if Opeyemi wants it chased; otherwise it sits here with the timeline intact.\\n\\nBears on documentation: nobody should write \\\"the dev app stays up\\\" in `docs/` until this is understood. It is the kind of sentence that becomes a support answer.\"},{\"id\":\"bug-control-json-crash-stale\",\"title\":\"control.json survives a crash and then survives the uninstall\",\"owner\":\"\",\"criterion\":\"\",\"kind\":\"bug\",\"evidence\":\"Measured by Rook 2026-09-14, and the way it was measured is the part worth copying.\\n\\nRook's first packaged-app run threw before `close()` and left a `control.json`; the clean run did not. **Two runs differing in one thing is a hypothesis, not a finding**, so it ran both deliberately with agent control on: a clean quit removes the file, `SIGKILL` leaves it — port, token, pid, mode `0600`.\\n\\nNot a functional defect on its own. Discovery already treats a dead pid as no app (see `single-instance`), so a stale file does not mislead the MCP server or another instance.\\n\\nThe cost is that it is a **token on disk with no owner**, and it then survives deleting the app along with everything else in `bug-history-survives-uninstall`. A loopback token is low-value — it is bound to a port nothing is listening on — but \\\"low-value credential left behind indefinitely after the program that made it is gone\\\" is the sort of sentence that is easier to fix than to defend.\\n\\nCheapest fix is a sweep at startup rather than a handler at exit: a crash is by definition the case where the exit path did not run, so anything that relies on shutdown cannot close this. The app already knows how to judge a dead pid; the same check can delete rather than only ignore.\\n\\nRelated: `a4` for the full inventory, and `bug-history-survives-uninstall` for the removal question this feeds into.\"}]},{\"id\":\"next\",\"name\":\"Next\",\"blurb\":\"Picked, not claimed — start here.\",\"cards\":[{\"id\":\"a1\",\"title\":\"Sign and notarise the app\",\"owner\":\"Rook (cert step is Opeyemi's)\",\"criterion\":\"A1\",\"kind\":\"readiness\",\"evidence\":\"A1'S GROUNDWORK ALREADY EXISTS, ON A BRANCH UNMERGED SINCE 2026-08-30. Henry cited `docs/signing.md` on this card without saying where it is; it is NOT on main, and a reader looking there finds nothing. Corrected here.\\n\\n    branch chore/signing (as of f3fdbe9, 2026-08-30)\\n      .github/workflows/ci.yml   +42   HAS_SIGNING gate, CSC_IDENTITY_AUTO_DISCOVERY\\n      docs/signing.md            +116  new file — the step-3 warning lives here\\n      package.json               +1    dist:signed = build + electron-builder --config.mac.notarize=true\\n\\n`HAS_SIGNING` is `secrets.CSC_LINK != '' && secrets.APPLE_API_KEY_ID != ''`, and the release step runs `dist:signed` only when it is true — so the fork case is already handled gracefully.\\n\\n**AND IT STILL MERGES CLEAN, which corrects Henry's first reading of it.** \\\"Two weeks stale, will need a rebase before anyone judges it\\\" overstated the cost. Measured by Rook and verified here independently:\\n\\n    base                          3521bc8, 2026-08-29\\n    commits on main since base    447\\n    conflicts if merged today     0\\n    commits touching ci.yml           3\\n    commits touching package.json    60   (almost all `npm version` bumps)\\n    commits touching docs/signing.md  0   (the file exists nowhere else, so nothing could)\\n\\n447 commits and it still applies, because the branch touches three files and main has barely moved in two of those places — ci.yml's later additions (plugin-tag, tested-on-main) sit BELOW the release job this edits. Rook's own caveat, kept because it is the right one: re-measure on the day someone merges rather than trusting this number, since it is true of today's main and nothing guarantees tomorrow's.\\n\\n**A SECOND CORRECTION, Rook's, and it changes the estimate rather than only the record.** Henry wrote that Rook \\\"had the shape right without the branch in front of it\\\". That was an inference and it was wrong. Rook had read `chore/signing:docs/signing.md` in full and the `main...chore/signing` diff before proposing anything — step 3's warning is where its `identityName=Restack Dev` build got its meaning, and its A1 design to Opeyemi opens by rebasing that branch. So the identity assertion was written to fit the existing `HAS_SIGNING` gate rather than to sit beside it. The groundwork is not merely known to exist; it has been read.\\n\\nROOK'S PROPOSED IDENTITY ASSERTION, stated concretely so it is judged as work rather than as a principle. Three lines after `dist:signed`, the build failing on any:\\n\\n    codesign -dv --verbose=4 \\u003capp>    authority must contain \\\"Developer ID Application: Voicify Limited (NDXPR623CF)\\\"\\n    spctl -a -vvv -t install \\u003capp>    must say  source=Notarized Developer ID\\n    xcrun stapler validate \\u003cdmg>      must pass, per DMG\\n\\nA shell step in the release job, not a new subsystem. It replaces nothing in docs/signing.md: the doc explains why, the assertion makes the why unskippable.\\n\\nTHE POINT THAT MAKES IT AN IDENTITY CHECK RATHER THAN A SIGNATURE CHECK, and it is Rook's: **assert what it must EQUAL, never \\\"is signed\\\" or \\\"is not unsigned\\\".** `spctl` accepts an ad-hoc signature happily, and \\\"signed\\\" is exactly the answer that was true today and wrong — electron-builder reported success with `identityName=Restack Dev`. The team id in the string is what makes it an identity. A check whose pass fits both \\\"signed as us\\\" and \\\"signed as anything\\\" is this project's own defect family, pointed at the release.\\n\\nSCOPE, deliberately not widened: NOT the local build. Enforcing it in `npm run dist` would fail on any machine without the cert, including a contributor's fork. It belongs where `HAS_SIGNING` is true.\\n\\nLIVE RISK CONFIRMED 2026-09-14, found by Rook while doing A4 and not while looking for it. docs/signing.md step 3 carries a warning about electron-builder picking the wrong identity. **It reproduced verbatim on the first build anyone has run since that warning was written**: electron-builder signed with `identityName=Restack Dev` and REPORTED SUCCESS.\\n\\nThat is the dangerous half. A wrong-identity signature does not fail — it succeeds, loudly, with a green build log, and the identity is only visible if someone reads which one it used. Anyone cutting a release without checking would ship a build signed by the wrong entity and have no signal at all.\\n\\nSo docs/signing.md is right and is not sufficient: a warning in a document is read once, and this needs a check that fires every time. Whoever takes A1 should treat \\\"assert the signing identity is the one intended, and fail the build otherwise\\\" as part of the work rather than a follow-up.\\n\\n**STATUS, measured 2026-09-15 rather than carried forward.** The line this replaces said *\\\"Blocked on Apple issuing a Developer ID Application certificate. The cert in ~/Documents/obsrv-signing is Apple Distribution (Voicify Limited) — wrong type.\\\"* **That is no longer true and had been stale for a day.** Apple issued it; the card did not notice.\\n\\n    ~/Documents/obsrv-signing/developerID_application.cer\\n        Developer ID Application: Voicify Limited (NDXPR623CF)     \\u003c- the right certificate, present\\n    ~/Documents/obsrv-signing/distribution.cer\\n        Apple Distribution: Voicify Limited (NDXPR623CF)           \\u003c- the wrong one, also present\\n\\nRead from the files with `openssl x509 -subject`, not from a recollection of which was downloaded.\\n\\n**WHAT IS ACTUALLY LEFT — three things, and only one of them is engineering.**\\n\\n**1. The G2 intermediate is not installed.** `security find-certificate -c \\\"Developer ID Certification Authority\\\"` returns nothing in any keychain. Without it the chain does not build, so the leaf cannot be used even though it is sitting on disk. It is a **public** download from Apple and not account-gated — Rook said so and offered to fetch it; Opeyemi is trying his account route first. Smallest blocker on the card.\\n\\n**2. `codesign` still sees only one identity.** `security find-identity -v -p codesigning` → `F446C3A9… \\\"Restack Dev\\\"`, 1 valid identity. The Developer ID leaf is not usable until it and its private key are imported together as a p12 — **and that step needs Opeyemi's password, so no session can do it.** It is not blocked on anyone's time but his.\\n\\n**3. The identity question is unanswered and is a decision, not a task.** The app would be signed as **Voicify Limited**, which is what Gatekeeper shows users, while `copyright` says Opeyemi Ajagbe and CI would hold Voicify's private key.\\n\\n**ALREADY SETTLED, so nobody re-opens it:** the keypair matches. Public-key SHA-256 of the cert's `-pubkey` against each `.key` — `obsrv-developer-id.key` (the 21:30 pair) matches the Developer ID leaf at `53c1b7ae`; the 21:34 pair is a different keypair at `1cd2c04d`. Rook established that by measurement before anyone warned about it.\\n\\n**AND `chore/signing` STILL MERGES CLEAN, re-measured on today's main** rather than trusting the earlier figure, which is what Rook's own caveat asked for:\\n\\n    base                        3521bc8, 2026-08-29\\n    commits on main since       539\\n    conflicts if merged today   0\\n\\nWiring waits on `chore/signing`, which is ready whenever the identity is.\"},{\"id\":\"queue-rook\",\"title\":\"QUEUE — Rook: c2-retroactive started · a1 on Opeyemi · log-attribution merged\",\"owner\":\"Rook\",\"criterion\":\"\",\"kind\":\"chore\",\"evidence\":\"REWRITTEN 2026-09-15 against measured state, not recollection. The previous version had\\n`chore-guard` IN PROGRESS and `flake-sync-165` QUEUED; both have been done for hours, and the\\ncard carried two stacked \\\"UPDATED\\\" sections contradicting each other. It also contained its own\\nepitaph — *\\\"the queue went stale within hours of being written\\\"* — which was true again.\\n\\n**NOW**\\n\\n1. `c2-retroactive` — **STARTED** on Opeyemi's go-ahead, 2026-09-15. Apply\\n   `docs/compatibility.md` to 0.56.0–0.60.0. The card carries the reconnaissance: four of the\\n   five releases have no register entry at all, and 0.58.0 is both the largest diff in the\\n   range and silent.\\n2. `bug-log-attribution` — **MERGED** `6f19f9b` on Opeyemi's word, card done. It carried\\n   `70209df` too, Rook's catch of a contradiction Henry introduced on\\n   `bug-suite-absent-on-conflict`. `bug-dev-app-exited` is unblocked by it and is unowned;\\n   Rook flagged in advance that taking it would mean reading output produced by its own\\n   change, and asked to be held to being slower to believe it.\\n\\n**BLOCKED, and not on anything Rook can do**\\n\\n3. `a1` — needs Opeyemi at a keyboard: the p12 password cannot be typed by any session, and the\\n   Voicify-versus-Opeyemi identity is his decision, not an engineering one. Already settled by\\n   measurement so nobody re-opens it: the keypair PAIRS (public-key SHA-256, `53c1b7ae`), and\\n   the G2 intermediate is a PUBLIC download, not account-gated — Henry relayed the opposite and\\n   has corrected it. `chore/signing` still merges clean.\\n\\n**NEXT IF THERE IS A GAP**\\n\\n4. `bug-orientation-name` — unstarted.\\n\\n**Not Rook's unless asked:** the three a4 follow-ups. Rook declined them unprompted as *\\\"mine by\\nprovenance, not by right\\\"*, and `chore-uninstall-path` is a decision about what Obsrv promises\\nrather than a cleanup.\\n\\n**Merge state, measured rather than remembered, because Rook has been carrying a stale count.**\\nRook reported four branches with Opeyemi. Two of those are already merged: `fix/suite-absence-loud`\\nlanded at `7feb26b` and the card closed at `f57924b`, and the contrast work landed at `d66d047`\\nand `7d57872`. The only unmerged branches in the repository are `fix/log-attribution`,\\n`chore/signing`, and the stale tail of `fix/suite-absence-loud` — whose one leftover commit was\\nOpeyemi's own, pushed after the merge, and has now been ported to main by hand.\\n\\n**And that hand-port leaves a trap, corrected here within minutes of writing the opposite.** I\\nfirst wrote that `chore/signing` was the only unmerged branch left after `6f19f9b`. It is not.\\n`fix/suite-absence-loud` still reports UNMERGED and always will, because I copied `4bd6ba1`'s\\ntext onto main instead of merging the commit — so the content is on main and the commit is not\\nan ancestor of it. Git cannot tell those apart and will keep flagging the branch, which is an\\ninvitation for the next person to re-investigate a thing already resolved. Two unmerged\\nbranches, then: `chore/signing`, which is real and blocked on Opeyemi, and\\n`fix/suite-absence-loud`, which is a ghost and should be deleted or merged empty so it stops\\nasking. That is Opeyemi's call, not a session's.\\n\\n**RESOLVED 2026-09-15: Opeyemi said delete, and it is deleted**, remote and local. Checked\\nbefore deleting rather than after, because a deletion cannot be checked afterwards: exactly one\\ncommit became unreachable, `4bd6ba130a8046b04f9e2993da8b07d4b6629a02`, and the only line that\\nexisted on it and not on main was the superseded false one — *\\\"Both branches and the PR are\\ngone\\\"* — which Rook had already corrected in `70209df`. Its real content, the `KEPT ON PURPOSE`\\nparagraph, is on main verbatim. No worktree held the branch.\\n\\nThe full sha is written above so the commit stays recoverable from GitHub for as long as it\\nkeeps unreachable objects, which is the only reason a sha belongs in prose. **`chore/signing` is\\nnow genuinely the only unmerged branch in the repository** — a sentence I wrote once before it\\nwas true.\\n\\n**Why this card keeps going stale, stated so the next rewrite is shorter:** a queue is a claim\\nabout several other cards, and nothing regenerates it when they move. `npm run board` checks\\nthat the VIEWS match the cards; it cannot check that a card's prose matches another card's\\ncolumn. Every line above is therefore a hand-maintained duplicate of state that lives elsewhere,\\nand the honest fix is fewer lines here, not more frequent updates.\\n\\n**It went stale again inside the hour, and the instance is worth more than the correction.**\\nThe paragraph below was written at 09:0x saying a queue card is a hand-maintained duplicate of\\nstate that lives elsewhere. `bug-log-attribution` merged at 09:5x and this card immediately\\nsaid IN REVIEW, at a commit (`334164d`) that was no longer even the branch tip — Rook had\\npushed `70209df` after reporting. Two separate staleness defects in one line, in the card whose\\nsubject is that line going stale, written by the person who had just written that it would.\\n\\nNothing here is a reason to update more often. It is a reason for this card to be shorter: the\\nonly lines above that cannot be read off another card are the routing decisions and the \\\"not\\nRook's unless asked\\\" list. Everything else is a copy, and `npm run board` cannot check a copy.\"},{\"id\":\"queue-kenya\",\"title\":\"QUEUE — Kenya: c5-elevated DONE · bug-retina DONE · c3 remains\",\"owner\":\"Kenya\",\"criterion\":\"\",\"kind\":\"chore\",\"evidence\":\"Updated 2026-09-14 evening. Two of three delivered, and the order changed — Opeyemi picked bug-retina directly rather than c3, so the queue Henry wrote was overtaken by the user's own routing. That is the correct precedence and the card records it rather than hiding it: Henry's word routes work, Opeyemi's authorises it.\\n\\n1. c5-elevated — DELIVERED into Review, 6b7acb4. Inverted the card's own fallback: `resizing` fires, keep the value.\\n2. bug-retina — DELIVERED into Review, cf52dc8, and it corrected the card's premise. See that card.\\n3. c3 — does skills/obsrv-screens/SKILL.md describe the tools that exist. NOT started; Kenya is putting it to Opeyemi before picking it up.\\n\\nHenry asked Kenya to SPLIT docs/c5-note-inventory into two branches so bug-retina can merge first — it makes every other local run cheaper to read, so it is worth more merged before people run suites than after. Sequencing only; both still wait on Opeyemi's word given to Kenya directly.\"},{\"id\":\"bug-lane-serves-another-tree\",\"title\":\"The dev lane says which tree it serves, and never says it is not yours\",\"owner\":\"\",\"criterion\":\"\",\"kind\":\"bug\",\"evidence\":\"Raised 2026-09-15 by Rook, out of `bug-contrast-figure-mismatch`, and filed unowned deliberately — see the last paragraph.\\n\\n**THE HAZARD.** The `obsrv-dev` MCP tools serve one lane per machine, and that lane serves whichever checkout built it. Measured while writing this card:\\n\\n    npm run lane -- --status   ->  main @ c7e57c4 · /Users/opeyemiajagbe/Documents/Projects/Obsrv\\n    the caller                     .../Obsrv/.claude/worktrees/rook-cli-version\\n\\nSo a session working in a worktree — which is the rule in CONTRIBUTING.md, not the exception — calls `obsrv-dev` tools and exercises **main, not its branch**. Nothing contradicts the assumption that it is testing its own work. The verification comes back green, and the green is about somebody else's code.\\n\\n**TWO INDEPENDENT ENCOUNTERS, and neither session was looking for it.** Rook, 2026-09-15, verifying the contrast fix: `mcp__obsrv-dev__obsrv_inspect` answered with `obsrv-dev lane: main @ abb508f` and the fix was in a worktree the lane had never built. Kenya, 2026-09-14, found the shared lane pointing at Henry's half-finished tree. One trap, two directions, two days.\\n\\n**WHY THIS IS A CARD AND NOT A KNOWN QUIRK.** The lane already reports its root, and that sentence caught it both times — so the information exists and the mechanism works. What is missing is the comparison. **The reply states a fact and never contrasts it with what the reader assumes**, which is this project's recurring defect wearing its plainest clothes: a true sentence that does not know what the reader believes. A stamp becomes a warning only if someone tired happens to compare two paths in their head.\\n\\n**WHAT MAKES IT LOAD-BEARING BEYOND ITSELF.** Every verification any session does through `obsrv-dev` is suspect unless that line was read and compared. This team's whole method is *measure rather than reason*, and this is the one hazard that corrupts the measuring instrument itself while leaving it looking correct. A false green here is indistinguishable from a real one.\\n\\n**THE OBVIOUS FIX, and the reason it is not obviously right.** Compare the lane's root with the caller's working directory and WARN when they differ, rather than stating the root and leaving the comparison to the reader.\\n\\nTwo things whoever takes it should establish rather than assume, because the obvious fix has a way to be wrong:\\n\\n- **An MCP server may not know the caller's worktree.** The proxy at `~/.obsrv-dev/bin/dev-mcp.js` runs where it runs; the session's cwd is not necessarily the tool's. If it cannot be known reliably, a warning built on a guess is worse than the stamp — it would cry wolf on a session that was right, and this repository has learned twice what that does to a guard (`chore-guard`, and the suite-answer check's no-open-PR exit).\\n- **Serving another tree is sometimes correct.** A session deliberately testing main from a worktree is a legitimate use, and `OBSRV_DEV_HOME` exists for a second lane. The warning has to distinguish *you are on a different tree* from *you are on a different tree than you think*, and only the second is worth a sentence. Whether that distinction is reachable at all is the first measurement.\\n\\n**UNOWNED, and Rook's reasoning for not taking it.** It found the hazard and already has an explanation of the fix, which is exactly the state it was in on `bug-contrast-figure-mismatch` — where its own two hypotheses were both wrong and a neutral instrument, not an explanation, found the answer. That argument was overruled once on good grounds (the finder held run 17's output and a cold reader would have reproduced it all). Here there is nothing to reproduce: the hazard is two lines of `--status` output, and a session arriving cold loses nothing and brings no committed theory about how the warning should work.\"},{\"id\":\"lesson-agreement-two-facts\",\"title\":\"Whatever decides, something else must notice when the decision changes\",\"owner\":\"\",\"criterion\":\"B5\",\"kind\":\"chore\",\"evidence\":\"THE RULE, which is the general form and the reason this card exists: whatever decides something, a separate thing must notice when that decision changes. Three instances turned up in one afternoon and none of us saw the pattern until the third:\\n  • a filtered test run decides nothing was compared — so the test must announce that it had no evidence (cbe4981)\\n  • an EXPLAINED row decides a difference is excused — so something must notice when the difference is gone (d69b2c1)\\n  • a motion probe would decide whether values are compared — so something must assert WHICH pages were compared\\n\\nTHE FINDING THAT PRODUCED IT (obsrv-e7, 2026-09-14). CI on cdd7056 failed the parity gate: `obsrv_audit pageHeight — moves: headless=1080 live=1065`, obsrv_lint the same, on tests/fixtures/moves-while-measured.html, which slides at 140 px/s. Read twice, fifteen px apart. The surfaces were never implicated. CI sequence: 586caab green (before the C4 work), cdd7056 failure (E2E, one test, one assertion, one page), 1d4e505 SUCCESS — so the red lasted one run and was never 'the C4 work'.\\n\\nTHE LESSON. This machine read 1080 twice on every local run, so the comparison was wrong from its first run and every local green was evidence that two reads landed in the same frame. A third kind of silence: not a VALUE that fits two opposite facts, but an AGREEMENT that fits two — two numbers matching means either 'these agree' or 'nothing moved between the reads'. Both gate verifications that day were sound and neither could have caught it: both test the LOGIC, and this was the INPUT.\\n\\nTHE DESIGN, argued between both sessions. obsrv-a6 proposed replacing the `moving` flag with src/shared/pageMotion.ts, which already answers 'was this page holding still' on both surfaces. obsrv-e7's objection, correct: THE PROBE ANSWERS PER-RUN TOO — a page that moves slowly, or only while loading, reads as still on a fast host, which is how `moves` got past everyone. A probe that silently decides whether to compare values gives a green that fits two facts again, harder to spot because nothing names it.\\n\\nSo: per page, store each surface's probe verdict and whether values were compared; assert that the value-compared set equals the expected set. A page that silently stops being compared goes red; so does one that starts. Take the UNION across surfaces — if either says moving, it was moving. KEEP THE FLAG as an override: a fixture whose purpose is motion should not depend on a probe agreeing about it on the day. Probe for discovery, flag for what we can state.\"},{\"id\":\"b4\",\"title\":\"Measure the noise ratio with two independent classifiers\",\"owner\":\"Kenya\",\"criterion\":\"B4\",\"kind\":\"readiness\",\"evidence\":\"zalando.de answered 143 findings; nobody has established how many a developer would act on. B5 now makes this interpretable.\\n\\nROUTED TO KENYA 2026-09-15, pending Opeyemi's word in Kenya's own session. Left in Next until\\nhe says go. Kenya asked to be routed by need and stated no preference on subject; this is the\\nneed.\\n\\n**Why this card is the need.** It is a readiness criterion, it is unowned, and until today it\\nwas one sentence long — nobody has started it. Its own text says *\\\"B5 now makes this\\ninterpretable\\\"*, and B5 became interpretable this week through Kenya's work: first the downgrade\\nto one desk, then the structural result that every CLI run is cold by construction, which\\nremoved the confound Henry had put beside it. The card was waiting on something that has now\\nhappened.\\n\\n**Why Kenya, and it is not availability.** The whole card turns on the word INDEPENDENT, and\\nthe failure mode is two classifiers that agree because they share a mechanism rather than\\nbecause the finding is real. Kenya found exactly that defect in its own instrument today — the\\nB5 fixture server sends `cache-control: no-store`, a second independent block on the thing\\nbeing measured, and Kenya's own words were *\\\"I built one of them myself without noticing.\\\"*\\nNobody on this board has more recently paid for that lesson.\\n\\n**The counter-argument, stated rather than left for someone to raise.** Kenya established B5,\\nand B4 is interpretable because of B5. That is a stake. It is weaker than the one that kept\\n`c2-retroactive` away from Henry — B4 measures a different quantity and does not mark B5's\\nhomework — but it is not nothing, and if B4 comes out flattering to B5 that coincidence should\\nbe stated in the write-up rather than left for a reader to notice.\\n\\n**What the card actually asks.** zalando.de answered 143 findings. Nobody has established how\\nmany a developer would act on, so \\\"143 findings\\\" is currently a number with no denominator —\\nit could be a thorough audit or a noisy one and the output reads identically. The ratio is the\\nproduct claim.\\n\\n**The traps, named in advance because this card is about a measurement being meaningful:**\\n\\n- **Independence is the whole thing.** Two classifiers that read the same rubric, or that both\\n  key off Obsrv's own severity or grouping, measure Obsrv's self-consistency rather than the\\n  noise ratio. State what makes the two independent BEFORE running, and say how it could fail.\\n- **A classifier that sees the finding's own prose is reading an argument.** Obsrv's sentences\\n  are written to be persuasive about why something matters — that is the product. Deciding\\n  \\\"would a developer act on this\\\" from the sentence rather than from the page tests the writing.\\n- **Agreement has the two-facts shape.** High agreement fits *the findings are clearly real* and\\n  *both classifiers share a blind spot*. Low agreement fits *the findings are noisy* and *the\\n  question was ambiguous*. Decide in advance which reading each outcome gets, or the result will\\n  be interpreted after the fact in whichever direction is convenient.\\n- **One site is one site.** zalando.de is a heavy commercial page; a noise ratio from it is not\\n  a noise ratio for the tool. Say what the number covers.\\n\\n**Pre-register the vacuity check, which is Kenya's own practice and the reason it is asked for\\nhere.** Kenya wrote down beforehand what would make the userData cache arms meaningless, and it\\ncaught both warm arms being vacuous at 4 KB and 12 KB — without it, two clean zeros would have\\nread as \\\"the cache does not matter\\\" and a cap would have shipped on nothing. The equivalent\\nhere: name, before running, the result that would mean *this experiment did not measure the\\nnoise ratio*, and make the run report that rather than a number.\\n\\nDepends on nothing. B5's state is recorded on `readiness.md` and on `bug-userdata-unbounded`.\"},{\"id\":\"bug-walk-coverage-diverges\",\"title\":\"The two walks cover a growing page differently — 3 screenfuls against 8\",\"owner\":\"obsrv-e7\",\"criterion\":\"C4\",\"kind\":\"bug\",\"evidence\":\"Measured 2026-09-14 (obsrv-a6), same file, same session, both surfaces:\\n\\n  headless  3 screenfuls, atEnd true, page measures 4712, covered 3072 → coverage note FIRES\\n  live      8 screenfuls, atEnd true, page measures 6832, covered 6912 → no gap, SILENT\\n\\nSame URL: a warning on one surface, nothing on the other, and the two measurements are of different amounts of page. Each answer is internally consistent, which is what makes it hard to notice.\\n\\nFIXTURE NOW IN THE REPO: tests/fixtures/app-shell-grows.html (merged 586caab) — an app shell whose inner feed extends twice as it is walked. No existing fixture had that shape; every other app-shell fixture walks further than the page measures, so none can make walkCoverageNote fire on an element scroller.\\n\\nHanded to obsrv-e7 to run through the C4 parity harness, which catches exactly this asymmetry (a note-bearing array present on one surface and empty on the other) and is how the panel silence and the inspect gap both surfaced. obsrv-e7's read: if live really never fires the coverage note on an app shell, it is a seventh defect rather than a footnote to the sixth.\\n\\nCause still open: the `hidden` divergence, the two walks scrolling differently, or the growth being timing-dependent. obsrv-a6's one-off comparison could not separate them.\"},{\"id\":\"chore-uninstall-path\",\"title\":\"There is no supported way to remove Obsrv's data\",\"owner\":\"\",\"criterion\":\"\",\"kind\":\"chore\",\"evidence\":\"Split from `bug-history-survives-uninstall` deliberately: that card is a privacy gap closable by a paragraph in the README, this one is a feature, and tying them means the cheap fix waits for the expensive one.\\n\\nDeleting `Obsrv.app` removes the app and nothing else — measured, 87 entries before and 86 after. There is no `obsrv uninstall`, and `npm rm -g getobsrv` leaves the 128 MB Electron zip in `~/Library/Caches/electron/` (see `a4`).\\n\\nTwo shapes, and the lighter one may be enough:\\n\\n- **A documented path list.** Four or five lines in the README naming every directory, so someone can remove them by hand and know they got all of it. No code, no risk of deleting the wrong thing on someone's behalf.\\n- **An `obsrv uninstall` command.** More usable, and it takes on the job of being careful — it must not delete a profile another instance is using, must say what it is about to remove before removing it, and must handle the CLI, the app and the MCP server having different footprints.\\n\\n**Prefer the list first.** It is the part that makes the privacy statement true, it can ship immediately, and it is the specification the command would have to implement anyway. A command written before the list exists is a command whose completeness nobody can check.\\n\\nWhoever takes the command: `a4`'s write-up (`docs/research/2026-09-14-a4-install-remains.md`) is the inventory, measured on a real packaged build rather than reasoned from the code.\"},{\"id\":\"bug-ci-main-red-37pct\",\"title\":\"CI on main fails about one run in three, from at least three different tests\",\"owner\":\"\",\"criterion\":\"B5\",\"kind\":\"bug\",\"evidence\":\"**THE CLASSIFIED LIST BELOW IS ALREADY PARTLY WRONG, measured 2026-09-15.** Three of its rows no longer point at a test — `live-drive.spec.ts:963`, `live-drive.spec.ts:1015` and `sync.spec.ts:165` — because the fixes moved them (to :969, and sync to :185). Hours, not months.\\n\\nThe rows that go stale first are the ones whose tests were FIXED, which are exactly the rows someone would cite to excuse a red as pre-existing. Raised by obsrv-91 as a future risk on `bug-suite-absent-on-conflict`; it was already true when raised.\\n\\n**Key on the test TITLE, not on `file:line`**, and make something fail when a row stops matching a real test. Same shape and same fix as the stale `EXPLAINED` row in the surface-parity gate.\\n\\n**THE 37% HAS HOLES IN IT NOW, AND HENRY PUT THEM THERE.** 2026-09-15.\\n\\nThe concurrency groups added in 450d5f9 cancelled three main CI runs — 154c8e3, 5eeb5f8, 4ee2bf9 — within minutes of landing. The guard was written to protect main from exactly that, with a comment above it saying so.\\n\\n**How it fails is the part to keep:** `cancel-in-progress` only protects a run that is IN PROGRESS. A run still PENDING — queued for a macOS runner, which is most of them here — is cancelled by a newer arrival in the same group whatever the flag says. Three commits pushed in quick succession each killed a queued predecessor.\\n\\nFixed by putting the sha in the group on main, so a main run is never in a group with another main run and there is nothing to supersede it.\\n\\n**Why it belongs on THIS card: a cancelled run is a commit with NO CI answer, which is worse than a red one.** This card is a tally of which commits went red, and a hole in it is indistinguishable from a commit nobody broke — the same two-facts shape the card is about, introduced into the card's own evidence by the person keeping it.\\n\\nSo the 27-run window and the 10 failures stand as measured BEFORE 450d5f9. Any recount that spans it has to treat cancelled runs as missing data rather than as passes.\\n\\n**ALL TEN NOW CLASSIFIED, which the card asked for.** Counts over every red run, not a sample:\\n\\n    live-drive:963     8 of 10        live-drive:1015   8 of 10   — the same eight, always together\\n    sync.spec:165      5              sync.spec:138     2         — 7 for sync.spec as a file\\n    devtools:92  2   devtools:116  2   sync-mirror-mark:41  2   stall  2   panes  2\\n    cli-walk:173, cli-snap-tiled:65, select:54, tabs:266, throttle-live:55, text-scale:251   1 each\\n\\n**`live-drive:963` and `:1015` are one fault, not two** — Rook's observation, and it holds eight for eight. They never appear apart. Counting them separately makes live-drive read as twice as noisy as it is, and it is already the dominant failure in the suite by a distance: eight of ten reds against sync:165's five.\\n\\nHenry got this wrong twice before it was right. First by sampling only the first failing test in three of the ten runs and presenting those rows beside seven complete ones, which understated live-drive by three. Then, before that, by a grep that matched the first test in the log rather than the failing one and returned `browser-identity.spec.ts:41` for all seven runs — every row identical was the tell, and it is the same grep trap this project wrote down six hours earlier.\\n\\n**TWO RUNS ARE A DIFFERENT CLASS.** `735f60f` (six specs) and `b89ec67` (seven) had unrelated specs failing at once — not six independent flakes, one environmental failure taking the run with it. Both contain `devtools:116` and `sync-mirror-mark:41`, which is a shared signature worth chasing. Excluding those two runs makes live-drive MORE dominant, not less: seven of eight, while sync:165 drops to four.\\n\\n**`sync-mirror-mark.spec.ts:41` fails in both of them**, and that is the file created to fix the sync coupling by splitting a test into its own file. The split moved the problem rather than removing it — so \\\"put it in its own file\\\" is not the remedy for whatever `flake-sync-165` finds.\\n\\n**Measured 2026-09-14 ~21:50, and it supersedes the single-test framing on `bug-resizing-test-flaky-ci`.** Henry reported \\\"main is red\\\" about one flaky test. It is not one test and it is not occasional.\\n\\n**Every completed CI run on main since the C5 merge (3f92680), counted:**\\n\\n    27 runs,  10 failures,  17 successes   —  37% red\\n\\n    failed: 202d118 c494f7c e921b64 735f60f 6a8cd02 b89ec67 ddb2c72 67c4176 81f139f a1c9050\\n\\n**At least three distinct tests, sampled rather than assumed:**\\n\\n    a1c9050   tests/e2e/live-drive.spec.ts:963    the resizing verdict\\n    b89ec67   tests/e2e/cli-walk.spec.ts:173\\n    6a8cd02   tests/e2e/devtools.spec.ts:92\\n\\nOnly the first is the one already carded. The other two are unexamined.\\n\\n**HOW THIS WENT UNNOTICED FOR OVER THREE HOURS, which is the part that matters more than the rate.** Every merge this evening was verified the same way: run the suite locally, read the green, push, report it as verified. Nobody read CI after the push. Several of the failing commits — a1c9050, 81f139f, 284dac2 — touch nothing but board cards and generated docs, so the failures cannot be caused by what was merged, and were visible the whole time to anyone who looked.\\n\\nHenry stated \\\"typecheck clean, 1121/1121, pushed\\\" repeatedly tonight. Each of those was true and none of them was about CI.\\n\\n**WHY IT IS THE STRONGEST EVIDENCE FOR `ci-second-host`, not a distraction from it.** The local desk and CI disagree, repeatedly, across at least three unrelated tests. That is the card's thesis demonstrated at scale: one desk cannot tell you whether a result is about the tool or about the machine. B5's repeatability zero was established on the local desk alone and says the tool does not drift; CI says something drifts about a third of the time.\\n\\nThose are not contradictory — B5 measured fixtures, these are live e2e — but nobody can say which kind of fact they are holding without the comparison `ci-second-host` asks for.\\n\\n**WHAT THIS CARD ASKS FOR,** and it is deliberately not \\\"fix the flakes\\\":\\n\\n- The failure for each of the ten runs, classified by test. Ten is small enough to read them all rather than sample three.\\n- Whether they share a cause — a shared app, a shared budget, host speed — or are three unrelated races that happen to coincide.\\n- A number for how long this has been true. The window measured here starts at the C5 merge because that is where Henry started looking, which is not evidence it started there.\\n\\n**AND A GATE QUESTION FOR OPEYEMI, because it is a policy decision rather than an engineering one:** at 37% red, CI currently cannot tell anyone whether a change broke something. A red run means nothing, so a green run means nothing either. Either the flakes get fixed or the suite gets quarantined into \\\"gating\\\" and \\\"informational\\\" — and the second is how a suite quietly stops being a gate while still looking like one.\\n\\nRelated: `bug-resizing-test-flaky-ci` is one instance. `ci-second-host` is the measurement this argues for. `chore-guard` is about greens that mean nothing; this is reds that mean nothing, which is the same disease.\"}]},{\"id\":\"doing\",\"name\":\"Doing\",\"blurb\":\"Claimed. Someone is on it.\",\"cards\":[{\"id\":\"c2-retroactive\",\"title\":\"Apply the breaking-changes policy to the last five releases\",\"owner\":\"Rook\",\"criterion\":\"C2\",\"kind\":\"readiness\",\"evidence\":\"**ROUTED TO ROOK 2026-09-15 on Opeyemi's word.** Pending Rook's own go-ahead in Rook's own\\nsession — routing is not a start, and this card is in Next until Rook's user says go.\\n\\n**GO-AHEAD FROM OPEYEMI 2026-09-15.** Rook starts. Own worktree off current main, Review not\\nmain, merge on Opeyemi's word direct to Rook, design to him before writing.\\n\\n**Reconnaissance done before handing it over, so the card does not start with a survey.** The\\nregister currently has entries for exactly two versions: `0.59.0`, and `0.61.0` marked\\nunreleased. **Four of the five releases in scope are silent** — 0.56.0, 0.57.0, 0.58.0, 0.60.0\\n— which is precisely the state obsrv-91 said to read hardest, because a release with no entry\\nfits *nothing broke* and *nobody looked* equally well.\\n\\nRanked by how much changed under that silence, `src/` only:\\n\\n| release | diff | register |\\n|---|---|---|\\n| 0.56.0 | 5 files, +69 −8 | silent |\\n| 0.57.0 | 9 files, +222 −27 | silent |\\n| **0.58.0** | **10 files, +463 −38** | **silent** |\\n| 0.59.0 | 11 files, +329 −50 | has an entry |\\n| 0.60.0 | 1 file, +47 −2 | silent |\\n\\n**0.58.0 is the largest diff in the range and has no entry at all.** 0.59.0 is immediately\\nafter it, is comparable in size, and *did* get one — so the pair is the natural place to start:\\nthe same author, the same fortnight, one release documented and its larger neighbour not.\\n\\n0.60.0 at one file is the cheapest to clear and the most likely to be genuinely empty. Clearing\\nit is still worth doing explicitly, because \\\"we checked and it was clean\\\" and \\\"we never checked\\\"\\nare the two facts this whole card exists to separate.\\n\\n**Start from the CLI's stdout key set**, per obsrv-91: it is asserted exactly at\\n`cli.spec.ts:79` — `Object.keys(json).sort()` against ten literal fields — which makes it the\\none contract a retroactive read can *verify* rather than argue. Note `0.61.0`'s existing entry\\nalready records that surface gaining `url`, so the mechanism is known to bite here.\\n\\nThe four contracts are unequal and a read that only checks MCP replies will miss three of them.\\nSee `docs/compatibility.md`.\\n\\n**Why Rook, on evidence rather than availability.** The task is reading prose against code with\\nno code to hide behind, and the failure mode is a clean result that means nobody asked hard\\nquestions. Rook has now done the honest version of that twice in a week: on\\n`bug-contrast-figure-mismatch` it measured instead of arguing and killed three hypotheses\\nincluding Henry's, and on `bug-log-attribution` it declined to answer the question it could not\\nanswer — *\\\"the stamp does not answer it backwards — it cannot attribute a single existing line,\\nand the write-up says so in those words rather than letting the result imply more than it is.\\\"*\\nThat is the temperament this card needs, because *\\\"I read five releases and found nothing\\\"* is\\na result that looks identical whether it is true or lazy.\\n\\n**And Rook reported the defect against itself unprompted, in the same hour:** a check of its own\\nprinted *\\\"(no stray app processes above)\\\"* directly beneath two processes that were still\\nrunning, and it said so in the write-up rather than quietly fixing it. Someone who volunteers\\nthat about their own output is the right reader for a register that nobody else will audit.\\n\\n**Rook did not write `docs/compatibility.md` and has no stake in it.** That is the point of the\\nexclusion below, and it is the whole reason this card is not Henry's.\\n\\n**OFFERED TO obsrv-91 FIRST, AND DECLINED — recorded because obsrv-91 asked for it to be.** It\\ndeclined permanently and for a reason about the channel rather than the work: *\\\"treat me as\\nunavailable for relayed offers until my user speaks to me directly. Do not hold\\n`c2-retroactive` or anything else for me, and do not check back.\\\"* Nobody should route work to\\nobsrv-91 through a peer until its own user speaks to it. It added that the card being gone by\\nthen is *\\\"the correct outcome, not a loss.\\\"*\\n\\n**It also named the one exclusion that stands.** The why-not-Henry argument below was written\\nabout writing-then-marking your own work; obsrv-91's reply was that it *\\\"applies to whoever\\ntakes it. Not me specifically. **Anyone but you.**\\\"*\\n\\n**Three framings it contributed free, unasked, while declining — recorded with credit because they change how the task should be done:**\\n\\n1. **Start from the CLI's stdout key set, not from MCP replies.** The suite asserts that key set exactly, which makes it the one contract with a mechanical check already in place — so a retroactive read can be *verified* there rather than argued. `cli.spec.ts:79` is the assertion: `Object.keys(json).sort()` against ten literal fields (`cssHeight`, `cssWidth`, `deviceScaleFactor`, `out`, `preset`, `profile`, `settled`, `unsettledReason`, `url`, `warnings`). **obsrv-91 cited line 51; that is the test declaration, and the assertion is 28 lines below it inside the same test.** The claim was right and the line was not — checked rather than taken, because a citation nobody opens is the same shape of trust this card exists to remove.\\n\\n2. **Read the quiet releases hardest.** *\\\"A release with no breaking-changes entry fits two facts: nothing broke, or nobody looked.\\\"* The register's silences are the evidence, not the gaps between it.\\n\\n3. **A clean result is itself suspect.** *\\\"'The policy covered everything' fits both 'it is good' and 'we only asked it easy questions'.\\\"* If all five releases resolve cleanly under `docs/compatibility.md`, the honest write-up says which cases were hard and what the policy did with them — otherwise the exercise has tested nothing.\\n\\nAll three are the same defect family this board keeps finding, aimed at this task in advance.\\n\\n**UNBLOCKED.** The card's own objection was that *\\\"applying an unwritten policy retroactively is how a register becomes a matter of taste\\\"*. The policy is now written: `docs/compatibility.md`, C1, 2026-09-15. Reading 0.56.0–0.60.0 against it is a defensible exercise rather than a judgement call, which it was not yesterday.\\n\\n**WHY NOT HENRY, stated because the obvious objection is that he is free and wrote the policy.** That is the reason, not the counter-argument. Kenya named the asymmetry earlier this week: *reading someone else's prose against the code and writing your own are different activities, and the standard slips on the second.* Someone applying their own freshly-written rule to five releases will find exactly the breaks the rule was shaped around and miss the ones it does not cover — and the rule was shaped this week, largely from 0.59.0 and 0.61.0. A reader who did not write it is the check on whether the policy is any good, and that is worth more than the register entries.\\n\\n**WHY obsrv-91 SPECIFICALLY.** This is a reading-and-judgement task with no code to hide behind, and obsrv-91's demonstrated strength this week has been exactly that: it released two cards rather than hold them against a maybe, it corrected its own shipped proposal when Kenya's result went against it, and it raised the classified-list rot as a future risk that turned out to be already true. It also has no stake in the policy.\\n\\n**WHAT THE CARD ACTUALLY ASKS, from its own text:** read 0.56.0 through 0.60.0 for anything that broke a caller and add it to `docs/breaking-changes.md`. Cheap per release since the notes exist on GitHub — **but it needs reading the diffs too, and the card says why: the releases that named a change are exactly the ones least likely to have missed one.** A release that shipped a breaking-changes entry had someone thinking about breakage; a release that shipped none may have had nobody looking.\\n\\n**One thing the new policy adds that the card predates:** four contracts, not one. MCP replies, the CLI's stdout key set, the control server, and exit codes. A retroactive read that only checks MCP replies will miss the CLI's key set, which 0.61.0 showed is asserted exactly by the suite and is therefore a contract someone else may be asserting too.\\n\\n**And the honest possible outcome:** finding nothing in a release is a result, and so is finding that the policy cannot decide a case. The second is more valuable — it means the policy has a hole, and a policy written this week has not been tested against anything except the week it was written in.\\n\\nWhat C2's check actually asks and the register does not yet satisfy: read 0.56.0 through 0.60.0 for anything that broke a caller and add it to docs/breaking-changes.md. Cheap per release — the notes exist on GitHub — but it needs reading the diffs too, since the releases that named a change are exactly the ones least likely to have missed one. Depended on C1 — ~~the policy defining what counts has not been written~~, and applying an unwritten policy retroactively is how a register becomes a matter of taste. **C1 shipped 2026-09-15 (`ac67e8b`, `docs/compatibility.md`) and this dependency is discharged.** Struck rather than deleted: the objection is why the card waited, and it is the standard the finished work is judged against.\"},{\"id\":\"bug-sync138-no-url-changed\",\"title\":\"The target emits no url-changed at all — a second shape, and the test named for it\",\"owner\":\"Kenya\",\"criterion\":\"\",\"kind\":\"bug\",\"evidence\":\"**START HERE — Kenya's framing, promoted above the evidence because it decides what the first day of work is.**\\n\\n> `:165` was answered by an instrument that reports WHICH BRANCH a decision took. This card has no decision — nothing was emitted. So the question is why an emission that should have happened did not, and **an instrument that reports a taken path cannot answer about a path not taken.**\\n\\nThat is the same shape as everything else this week: an absence that two facts fit, with no instrument pointed at the absence. `mirrorTrace()` is not a smaller version of what this needs; it is the wrong direction. Building the right one is likely most of the work, as it was last time.\\n\\nThe second thing to keep, and it is Rook's: it separated observed from inferred, then refused to call its own fix innocent on one-against-zero. **The honest form of \\\"my change is innocent\\\" is \\\"nothing here can tell you yet.\\\"**\\n\\nASSIGNED TO KENYA 2026-09-15 on Opeyemi's word, **on Rook's own recommendation that someone come to this file cold** — offered against its own interest, and the reason is the point of the assignment rather than politeness. Two models of that file were held tonight and both were wrong; the session that just built a correct one is also the one most primed to see it again.\\n\\n**SO THIS CARD SEPARATES WHAT WAS OBSERVED FROM WHAT WAS INFERRED, and the inferences are Rook's to discard rather than Kenya's to inherit.**\\n\\n**Observed, and safe to build on:**\\n\\n- One failure in 160 post-fix runs, at `sync.spec.ts:161`: `expect(seen.length).toBeGreaterThanOrEqual(1)`. The target emitted **no `url-changed` at all** during the window.\\n- `mirrorTrace()` printed nothing for it — the test never reaches the step loop that dumps the trace.\\n- `sync.spec:138` failed **0 times in 113 runs before** the stale-echo fix and **1 time in 160 after**.\\n- It also flaked once on CI (`run 34929956587`, main @ 4ee2bf9), failing then passing on retry, leaving a green run and a `1 flaky` line.\\n- Those batches were `--retries=0`; CI is `--retries=1`. The two sets of numbers are not comparable, and any CI-derived rate is a floor.\\n\\n**Inferred, by Rook, and explicitly NOT established:**\\n\\n- That the stale-echo fix is innocent of this. Its argument: the change only ever DELETES records, so it can cause more mirroring and never less, and therefore cannot suppress an emission. Rook itself refused to treat this as evidence — one against zero is not a difference.\\n- That this is a different fault from `:165` rather than the same one wearing another shape. The shapes differ as observed; whether the causes do is open.\\n\\n**What is genuinely different about the investigation:** `:165` was solved by an instrument that answered *which branch did the decision take*. This failure never reaches a decision — nothing is emitted. So `mirrorTrace()` does not reach it, and whatever answers *why did nothing emit* is a different instrument. Building it is likely most of the work, as it was last time.\\n\\n**And the title is still the finding.** *\\\"A redirecting page leaves no stale expectation behind\\\"* — the test is named for the invariant, `redirect.html`'s comment says the same, both are two years older than the bug, and the test was passing while the invariant was broken because it asserts the target FOLLOWED rather than that the record was GONE. Whatever this card finds, the same question is worth asking of it: does the assertion check the thing the title claims?\\n\\nRaised 2026-09-15 by Rook, from its own post-fix batch, and deliberately NOT folded into `bug-stale-issued-echo`.\\n\\n**The observation.** In 160 runs after the stale-echo fix, `sync.spec.ts:138` failed once:\\n\\n    expect(seen.length).toBeGreaterThanOrEqual(1)     sync.spec.ts:161\\n\\nThe target emitted **no `url-changed` at all** during the window. That is a different shape from `:165`, which is a mirror that stalled after being decided against — here nothing is decided, because nothing is emitted. `mirrorTrace()` printed nothing, since the test never reaches the step loop that dumps it.\\n\\n**WHETHER THE FIX CAUSED IT IS OPEN, and Rook refused to close it by reasoning.** Its argument that the change is innocent: it only ever DELETES records, so it can make fewer commits look like echoes — more mirroring, not less — which cannot suppress an emission. Its argument against its own argument: `:138` failed 0 times in 113 runs before and 1 time in 160 after, and **one against zero is not a difference.** It declined to treat a plausible model as evidence, on a card whose history is two plausible models that were wrong.\\n\\n**Why this is its own card and not the tail of that one.** Two wrong models have already been held about that file tonight, by the same session, and both were killed by an instrument rather than by argument. A third investigation carrying the first two's assumptions is the risk, and the shape here differs from the shape there.\\n\\n**ROOK'S OWN RECOMMENDATION, which it volunteered against its own interest:** if Opeyemi would rather someone came to that file cold after tonight, that is the better call, and Rook says so even though it would take the card. Worth honouring unless there is a reason not to — the person who has just built a correct model is also the person most primed to see it again.\\n\\n**What the investigation needs that the last one did not:** `mirrorTrace()` does not reach this failure. Whatever instrument answers \\\"why did nothing emit\\\" is a different one from \\\"which branch did the decision take\\\", and building it is most of the work — as it was last time.\\n\\n**A measurement note that applies to any counting here:** Rook's batches are `--retries=0` so every occurrence counts; CI is `--retries=1` so an occurrence that passes on retry leaves a green run and a `1 flaky` line. Numbers from the two are not comparable, and CI-derived rates are floors.\\n\\n---\\n\\n**INSTRUMENT BUILT 2026-09-15 by Kenya, into Review. Branch `fix/sync138-absence-instrument`. NOT merged, NOT pushed — waits on Opeyemi's word given to Kenya directly. THE CAUSE IS NOT FOUND; this makes the next failure legible and nothing more.**\\n\\n`TargetSource.commitTrace()` records every main-frame commit and whether the pane said anything about it — and when it did not, which rule silenced it. There are two such rules and both are invisible from outside: `internal` (the recreation's own `about:blank`) and `restoring` (Obsrv re-loading the page it was already showing after a density change).\\n\\nSo the four facts a silence used to fit are now separable:\\n\\n    mirror trace empty            the bus never saw the native commit\\n    mirror trace 'trip'           the breaker suppressed the mirror\\n    mirror trace 'already-there'  the panes were judged in step\\n    commit trace EMPTY            nothing committed in the target at all\\n    commit trace said: false      a commit happened and was silenced, with the rule named\\n\\n`sync.spec.ts:138` now reads both traces on every run and carries them in the assertion message, so the one failure in 160 explains itself instead of printing nothing. `mirrorTrace()` was never reached on this path — the test fails before the step loop that dumps it — which is why the card said the instrument was pointed the wrong way.\\n\\n**WATCHED WORKING, because an instrument nobody has seen fire is worth what the note nobody had seen fire was worth.** Forcing the silent-commit path (a temporary env gate, since reverted) produced this on the failure:\\n\\n    mirror:  native -> hairline  branch \\\"issued\\\"  (other was redirect.html)\\n             native -> redirect  branch \\\"issued\\\"  (other was hairline.html)\\n    commits: 6 x did-navigate, said: false, why: \\\"restoring\\\"\\n\\nWhich is the account the empty array could not give: the bus decided, issued the mirror, the target committed six times, and every commit was deliberately silent.\\n\\n**DID NOT REPRODUCE.** 40 file-runs, 400 test-executions, `--retries=0`: all passed. At one in 160 that is about a one-in-five chance of catching it, so this is not evidence the flake is gone and is not evidence the instrument works on the real shape — only on the forced one. Rook ran separate invocations; `--repeat-each` re-runs inside one process, so the two batches are not equivalent and mine is the weaker of the two.\\n\\n**A HARNESS FACT, since it differs from live-drive.spec:** `-g` filtering works on `sync.spec.ts` — its app is created in a per-file `beforeAll` with no dependency on a previous test having run. `live-drive.spec.ts` sets `info` in its first test and dies under `-g`.\\n\\n**AND ONE THING I GOT WRONG, recorded because it nearly became a false reproduction.** The first run after building the instrument failed two tests, one of them this card's. It was not the flake: `npx playwright test` runs against the built `out/`, and I had changed `src/` without rebuilding, so the test ran against a build with no `commitTrace` in it. Had I reported that as a reproduction it would have been a real bug, falsely reproduced, on the first attempt.\\n\\n**NOT DONE, and it is the card's own question:** whether the assertion checks what the title claims. `seen.length >= 1` is still the only witness that the target moved at all — the poll that follows passes trivially, because the target is already on HAIRLINE from the previous step, so \\\"followed and came back\\\" and \\\"never moved\\\" are the same observation to it. Anything that makes this test green should be checked against that before it is believed.\"}]},{\"id\":\"done\",\"name\":\"Done\",\"blurb\":\"Merged.\",\"cards\":[{\"id\":\"bug-settled-fallback-silent\",\"title\":\"`settled` degrades to the old meaning on an older app, without saying so\",\"owner\":\"obsrv-91\",\"criterion\":\"C4\",\"kind\":\"bug\",\"evidence\":\"CLOSED 2026-09-14 — already fixed before this card was written, and the card was the one thing that was stale. obsrv-a6 raised it in review of obsrv-91's stack and obsrv-91 fixed it before merging: commit c8b7f15, merged in cdd7056, CI green at 1d4e505.\\n\\nVERIFIED rather than taken on the peer's word: `git merge-base --is-ancestor c8b7f15 origin/main` → yes, and origin/main:src/mcp/server.ts ~1012 carries the warning, pushed into the same array as capture.warnings, saying the app is older than the capture's settle verdict, that `settled` therefore reports whether the navigation was confirmed rather than whether the page went paint-quiet, and to update the app for the other answer.\\n\\nClosed rather than assigned deliberately: anyone taking it reads the code, finds the warning already there, and loses twenty minutes deciding whether they are looking at the right line. A card describing a fixed bug costs more than no card.\\n\\nOriginal diagnosis below, which was exactly right.\\n\\n`liveSnap` answered `settled: capture.settled ?? confirmed`. The fallback is RIGHT; the objection was that it was silent — one name meaning two things across app VERSIONS, in the commit whose whole point was removing that across surfaces.\"},{\"id\":\"c5-elevated\",\"title\":\"C5 is the criterion that catches what field comparison cannot\",\"owner\":\"Kenya\",\"criterion\":\"C5\",\"kind\":\"readiness\",\"evidence\":\"MERGED 2026-09-14 on Opeyemi's word, as 3f92680 on main, pushed. Verified here before pushing rather than taken on the branch's report: typecheck clean across all three configs, and live-drive 45 passed, 58.4 s against Kenya's 58.1 s.\\n\\nAnd checked that the NEW TEST ACTUALLY RAN, which on this card of all cards is not a formality — a suite passing 45 while the one new test was skipped is exactly the defect being closed. `tests/e2e/live-drive.spec.ts:963`, listed as 35/45 in both runs, no skips, no flakes. Two runs, and unlike the retina verification these are genuine corroboration: the test provokes pane RESIZING, which is independent of the desk's display scale, so a second run on the same machine is not the same measurement twice.\\n\\nC5 remains PARTLY MET and the merge does not change that: the 41 headless and MCP call sites are still unchecked, and readiness.md says so rather than implying otherwise.\\n\\nDELIVERED 2026-09-14 by Kenya, into Review. Branch `docs/c5-note-inventory` (as of 856d268 + 5c6ad3d, rebased onto 98d3f82). THE BRANCH IS THE ADDRESS; the shas are a timestamp and do not survive a rebase — these are already the second set, the first being 6b7acb4 + d1706f0. Rebase was clean, no conflicts, and re-verified after it: live-drive 45 passed, 58.1 s, the same count and the same duration as before. Kenya confirmed 98d3f82 was in origin/main by merge-base before rebasing onto it rather than reading it off a message. NOT merged, NOT pushed — waits on Opeyemi's word given to Kenya directly. Split out from bug-retina at Henry's request so that one can merge first; no file appears in both branches, so they merge in either order.\\n\\nTouches docs/breaking-changes.md, docs/note-inventory.md, docs/readiness.md, tests/e2e/live-drive.spec.ts. live-drive: 45 passed, 58.1 s.\\n\\nd1706f0 also rewrites the 0.61.0 entry in docs/breaking-changes.md: `Decided 2026-09-14 rather than arrived at` now reads as OBSERVED, three of three. It keeps the eight-viewport cycle AND the 30,000-flip negative result, because the obvious two-preset test returns `animating` and reads as proof the value is unreachable — so the negative result is the load-bearing half of the record, not a curiosity.\\n\\nTHE CARD'S FALLBACK WAS WRONG AND IS NOW INVERTED. `unsettledReason: 'resizing'` FIRES. Seen 3 runs of 3, on a real page, in the app. KEEP THE VALUE — do not remove it. This also retro-justifies shipping the enum in 0.61.0: docs/breaking-changes.md says the state is real, and it now has an observation behind it rather than a decision.\\n\\nWhy it looked unreachable, which is the part worth keeping: settleTarget (ipc.ts:1093) exits on two EQUAL consecutive 80 ms viewport reads inside a 4 s budget. Flipping between TWO presets gives each pair of reads a coin-flip chance of agreeing, so it exits `settled` almost at once — Kenya measured that first, 30,000 flips deep, and got `animating`. EIGHT distinct viewports in rotation keep consecutive reads disagreeing across the whole budget, and only then does it fall through to 'resizing' at ipc.ts:1105. So the real-world shape is not `a capture that caught a resize` but `the viewport changing on essentially every read for four continuous seconds` — a window dragged by its corner while a capture runs. The card's guess that it needed a harness fixture rather than an HTML one was right; the guess that a preset flip would do it was the part that hid it for a day.\\n\\nDelivered:\\n• tests/e2e/live-drive.spec.ts — the positive case beside the existing negative assertion at :955, so the pair reads `this is when it fires` and `this is when it must not`. Full spec 44 passed, 1 skipped, 55.6 s, unfiltered.\\n• docs/note-inventory.md — 58 emitting call sites; the 17 on the live surface hand-checked: 3 observed, 14 never seen, published as such with file and line.\\n• docs/readiness.md — C5 PARTLY met, with the 41 unchecked headless/MCP sites named as unchecked rather than implied done.\\n\\nTHE FOURTH SHAPE OF THE DAY'S DEFECT, named by obsrv-91 against its own shipped proposal, and the one that belongs highest on this card: A VALUE NEVER OBSERVED FITS TWO FACTS — either it cannot happen, or nobody has provoked it hard enough. Removing it on the first is right; removing it on the second is data loss. The two are indistinguishable until someone designs an experiment to make it fire.\\n\\nobsrv-91 added `resizing` yesterday, told its user plainly it had never seen it fire, and proposed removing the value if it proved unreachable — suggesting a preset flip as the way to try. The flip is exactly what cannot produce it. So a CHEAP attempt to provoke a value feels like a test of reachability and is not: `nobody has made it happen` was never evidence it could not, and the error was reasoning as though one honest try settled it. obsrv-91's own words: its verification habit is to make checks fail on purpose, and this is the same move pointed at a value rather than an assertion.\\n\\nTWO METHOD FINDINGS Kenya asked be kept out of the commit message:\\n1. A phrase sieve over the suite UNDERCOUNTS. Matching note text mechanically said `55 of 58 never asserted`; spot-checking six found four that ARE asserted, through regexes and partial phrases the matcher cannot see (cli-snap-tiled.spec.ts:102, cli-walk.spec.ts:137, others). The sieve is in the file as a pointer to where to look, explicitly not as a result. A number that reads as measurement and is not is the same defect as the note that had never fired. Anyone automating C5: this is the trap.\\n2. live-drive.spec sets `info` (control port and token) in the FIRST test of the file, so any -g filtered single-test run dies on `Cannot read properties of undefined (reading 'token')`. It reads like a bug in whatever test you just wrote. Cost a run.\"},{\"id\":\"ci-second-host\",\"title\":\"Run the suite on a host unlike this laptop, more than once a release\",\"owner\":\"Kenya\",\"criterion\":\"B5\",\"kind\":\"chore\",\"evidence\":\"MERGED 2026-09-15 on Opeyemi's word, as eb9a58b on main. Card left in Review for several hours afterwards — Henry merges and closes as two steps, and skipped the second.\\n\\n**The criterion is NOT met and this card does not claim it.** The sweep exists and has been run on two desks; what it found is that B5's fixture zero is a property of this laptop. `docs/readiness.md` reads \\\"MET ON ONE DESK, and a second desk disagrees\\\". The remaining work is on the card as the classifier note — the sweep still buckets \\\"a sentence whose only difference is a number of milliseconds\\\" with \\\"a sentence that appeared or did not\\\", which are opposite findings.\\n\\nTHE COMPARISON EXISTS, which is what this card asked for, and it comes out against B5's published number. Five runs a side, same code, same fixtures, same preset:\\n\\n    this laptop   Apple M4 Pro, 14 cores, 1x ultrawide      result fields moved: 0   182 s\\n    CI            Apple M1 (Virtual), 3 cores                result fields moved: 3   225 s\\n                  errors 0 and comparator control passed on both desks\\n                  1,061 leaves a run, per-case leaf counts identical across desks\\n\\nBoth diverging cases are `grows-as-walked.html`, and the values say two different things.\\n\\n**A NOTE THAT SOMETIMES DOES NOT FIRE.** On audit, `warnings.length` was 1, 1, 1, **0**, 1 across the five CI runs. The missing one is the page-is-still-moving note: \\\"this page was still moving when it was measured: 40 had been replaced in the 254 ms after the figures were taken\\\". On a 3-core VM that note fires four times in five. This is a real result difference and it is the one that matters: the tool's own warning about an unstable page is itself unstable there.\\n\\n**A SENTENCE THAT EMBEDS A DURATION.** On lint, the same note fired all five times and its text still differed: 258 ms, 261 ms, 256 ms, 259 ms, 256 ms. Nothing about the page's measurement changed; the sentence quotes an elapsed time. A warning that embeds a duration can never be byte-identical across runs, so any sentence-level comparison flags it forever — on this desk too, if the note fired here at all.\\n\\n**AND THE DIVERGENCE ITSELF VARIES.** The first CI run moved `pageHeight`, `summary.text.count` and `warnings[0]`; the second moved `warnings.length` and `warnings[0]` on audit and `warnings[0]` on lint. Same desk, same tree, different set. So \\\"4 fields\\\" and \\\"3 fields\\\" are both samples of a range rather than a figure, and the card records both rather than the tidier one.\\n\\nNEXT, AND DELIBERATELY NOT DONE HERE: the classifier should separate \\\"a sentence whose only difference is an embedded number\\\" from \\\"a sentence that appeared or did not\\\". They are one bucket today, and they are opposite findings — the first is a wording property, the second is the tool answering differently. I did not change it after the numbers were taken, because the committed code should be the code that produced the artefacts on the card.\\n\\n---\\n\\nCLAIMED 2026-09-14 evening by Kenya, on Opeyemi's word given in his own session. IN DOING, not Review: the card is done when the COMPARISON EXISTS, and the second desk has not run yet. What exists is the harness that lets it, and one desk's numbers from it.\\n\\nWHAT IS BUILT.\\n\\n`scripts/b5-fixture-sweep.js` — the fixture half of the B5 sweep, committed. The original harness was five scratch files, thrown away on the grounds that the method was the thing to keep (docs/research/2026-09-14-b5-repeatability.md, \\\"Reproducing it\\\"). That is true for a method and false for a comparison: two desks cannot be compared unless both ran the same code, so this is the method made runnable rather than described.\\n\\nIt serves every fixture from memory so each run gets byte-identical bytes, runs `audit` and `lint` N times per fixture, flattens each reply to leaves, and classifies anything that moved as timing, path or result. It carries the original's vacuity guard — plant a raised count, a dropped finding and a changed sentence into the saved runs, and fail if the comparator cannot see them.\\n\\nAND IT RECORDS THE DESK, which the original could not have known to do. `bug-retina` is why: three assertions recorded for two days as \\\"fails on this laptop, passes on CI\\\" turned out to track WHICH MONITOR WAS PLUGGED IN. Two hosts differing only in hardware tell you nothing if neither wrote down its display state. Every report carries CPU, cores, platform, and on macOS the `Resolution` / `UI Looks like` / `Main Display` lines that separate a 1x desk from a 2x one.\\n\\n`.github/workflows/b5-sweep.yml` — the sweep on macos-14: different silicon, and a display that never moves. That fixed display is why CI is a useful second desk and also why it cannot finish the job — one unchanging desk is a second sample, not a range. Deliberately NOT part of the CI gate: a difference between desks is the result this card asks for, and a result that turns a pull request red is one people learn to route around. It runs weekly, on dispatch, and on a pull request that touches the harness itself — which is also how the first CI number gets taken, since `workflow_dispatch` is only offered for workflows already on the default branch.\\n\\nTHIS DESK, 2026-09-14 (baseline to compare CI against):\\n\\n    24 cases × 3 runs, preset laptop-768, Apple M4 Pro, 14 cores\\n    main display 3440x1440, UI Looks like 3440x1440 — a 1x desk\\n    result fields moved: 0 across 0 cases\\n    errors: 0    comparator control: saw every planted difference\\n    1,061 leaves compared per run, 109 s\\n\\nThat 0 agrees with the published fixture number, on the same machine that produced it, which is the weakest possible confirmation and is stated as such. The card turns on what CI answers.\\n\\nTWO DEFECTS IN THE HARNESS, FOUND BEFORE IT PRODUCED A NUMBER ANYONE COULD USE. Both are on the card because both are the failure this whole criterion is about.\\n\\n1. THE FIRST SMOKE RUN REPORTED A PERFECT GREEN OVER FOURTEEN CASES THAT HAD ALL FAILED TO LOAD. \\\"result fields moved: 0\\\" and \\\"the comparator saw every planted difference\\\", with every case carrying `load did not finish within 30000 ms` and 30 leaves where a real run has 50-180. Cause: `spawnSync` blocks the event loop that the fixture server runs on, so every run waited out its load budget against a server that could not answer until that run finished. Now async.\\n\\n   THE PLANTED-DIFFERENCE CONTROL PASSED THROUGHOUT, and was right to: plants go into the saved leaves, so they still differ when every run is equally empty. The control proves the comparator is not blind. It cannot prove there was anything to look at. So there is now a SECOND guard — each run must show it measured the page — and it checks the thing the first one structurally cannot.\\n\\n2. THE SECOND GUARD THEN OVER-TRIGGERED, discarding `animated-tall` because its reply says \\\"nothing to measure: the page had no visible text and no targets\\\". That is a legitimate case, and in the original sweep five such cases were the STRONGEST result: their explanatory notes were byte-identical across all five runs. Only a load that never arrived makes a run empty of evidence rather than empty of findings.\\n\\n   Related, and the reason the fixture list changed: the first list was seven structural shapes, and 9 of its 12 valid cases had zero findings — so \\\"0 fields moved\\\" was a statement about 447 leaves, most of them the same four walk counts. Pages that actually produce findings (`audit`, `lint`, `contrast`, `hairline`, `app-shell-findings`) are in the core list now, which took it to 1,061. The original compared 3,375 a run over 33 cases; `--all` widens this one and the gap is honest rather than closed.\\n\\nWHAT WOULD FINISH THE CARD: the CI r
